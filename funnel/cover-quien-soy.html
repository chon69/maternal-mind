<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portada Destacado · Quién soy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#b8b8b8; display:flex; justify-content:center; padding:20px; }
/* 1080x1080; el círculo central (~62% ancho) es la zona visible en la burbuja */
.cover { width:1080px; height:1080px; position:relative; overflow:hidden; background:#FAF2E1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.wash { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:820px; height:820px; border-radius:50%; background:radial-gradient(circle,#D9F1EE 0%,#EFF7EC 45%,transparent 72%); }
.wash2 { position:absolute; bottom:120px; right:120px; width:360px; height:360px; border-radius:50%; background:radial-gradient(circle,rgba(245,223,160,0.35) 0%,transparent 70%); }
.inner { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:44px; }
.rings { display:block; }
.label { font-family:'DM Sans',sans-serif; font-size:56px; font-weight:500; letter-spacing:0.22em; text-transform:uppercase; color:#4AADA7; }
.label .b { color:#F2C14E; }
.safe-ring { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:670px; height:670px; border:2px dashed rgba(0,0,0,0.18); border-radius:50%; z-index:5; }
</style>
</head>
<body>
<div class="cover" id="cover">
  <div class="wash"></div>
  <div class="wash2"></div>
  <div class="inner">
    <svg class="rings" width="330" height="190" viewBox="0 0 120 68" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="46" cy="34" r="26" stroke="#4AADA7" stroke-width="5"/>
      <circle cx="74" cy="34" r="26" stroke="#F2C14E" stroke-width="5"/>
    </svg>
    <div class="label">quién <span class="b">soy</span></div>
  </div>
</div>
</body>
</html>
