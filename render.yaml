services:
  - type: web
    name: maternal-mind
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maternal-mind-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: maternal-mind-db
    databaseName: maternal_mind
    user: maternal_mind
    plan: free
