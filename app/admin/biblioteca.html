<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca · Admin · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7AACB0;--turq-dark:#5B9298;--turq-deep:#4A8A8E;--turq-light:#C2D9DB;--turq-vlight:#EDF4F5;--gold:#C4A882;--gold-light:#F5EFE6;--ink:#3A3A3A;--ink-soft:#5E5E5E;--cream:#FDFAF5;--sidebar:220px;--red:#D95555}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:#F4F6F8;color:var(--ink);min-height:100vh;display:flex}
  .sidebar{width:var(--sidebar);background:#fff;border-right:1px solid rgba(122,172,176,.18);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;overflow-y:auto}
  .sidebar-logo{padding:1.25rem 1.5rem;border-bottom:1px solid rgba(122,172,176,.15);display:flex;align-items:center;gap:.5rem;text-decoration:none}
  .logo-text{font-size:.9rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
  .sidebar-nav{padding:.75rem 0;flex:1}
  .nav-section{padding:.5rem 1.5rem .25rem;font-size:.6rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--turq-deep)}
  .nav-item{display:flex;align-items:center;gap:.65rem;padding:.65rem 1.5rem;font-size:.85rem;color:var(--ink-soft);text-decoration:none;transition:background .15s,color .15s;border-left:3px solid transparent}
  .nav-item:hover{background:var(--turq-vlight);color:var(--turq-dark)}
  .nav-item.active{background:var(--turq-vlight);color:var(--turq-dark);border-left-color:var(--turq);font-weight:500}
  .nav-item svg{flex-shrink:0}
  .sidebar-footer{padding:1rem 1.5rem;border-top:1px solid rgba(122,172,176,.15)}
  .btn-logout{width:100%;padding:.6rem;background:none;border:1px solid var(--turq-light);border-radius:8px;color:var(--turq-dark);font-size:.8rem;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .2s}
  .btn-logout:hover{background:var(--turq-vlight)}
  .main{margin-left:var(--sidebar);flex:1;padding:2rem;min-height:100vh}
  .page-header{margin-bottom:2rem;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem}
  .page-header h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;font-style:italic}
  /* GRID */
  .search-bar{margin-bottom:1.5rem;display:flex;gap:.75rem;flex-wrap:wrap}
  .search-input{padding:.6rem 1rem;border:1.5px solid var(--turq-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--ink);background:#fff;outline:none;min-width:240px;flex:1}
  .search-input:focus{border-color:var(--turq)}
  .books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
  .book-card{background:#fff;border-radius:14px;border:1px solid rgba(122,172,176,.15);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
  .book-card:hover{box-shadow:0 8px 24px rgba(74,138,142,.1);transform:translateY(-2px)}
  .book-cover{height:130px;background:linear-gradient(135deg,var(--turq-vlight),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:2.5rem;flex-shrink:0}
  .book-cover img{width:100%;height:100%;object-fit:cover}
  .book-body{padding:1rem;flex:1;display:flex;flex-direction:column;gap:.4rem}
  .book-title{font-size:.92rem;font-weight:500;line-height:1.4;color:var(--ink)}
  .book-meta{display:flex;gap:.4rem;flex-wrap:wrap}
  .book-tag{font-size:.6rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--turq-deep);background:var(--turq-vlight);border:1px solid var(--turq-light);padding:.15rem .5rem;border-radius:50px}
  .book-desc{font-size:.78rem;color:var(--ink-soft);line-height:1.6;flex:1;margin-top:.25rem}
  .book-link{display:inline-block;margin-top:.75rem;font-size:.78rem;color:var(--turq-dark);text-decoration:none;font-weight:500}
  .book-link:hover{text-decoration:underline}
  /* CONNECT STATE */
  .connect-state{background:#fff;border-radius:16px;border:1px solid rgba(122,172,176,.18);padding:3rem 2rem;text-align:center;max-width:560px;margin:0 auto}
  .connect-state svg{color:var(--turq-light);margin-bottom:1.25rem}
  .connect-state h2{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;font-style:italic;margin-bottom:.75rem;color:var(--turq-deep)}
  .connect-state p{font-size:.88rem;color:var(--ink-soft);line-height:1.75;margin-bottom:1.25rem}
  .steps{text-align:left;background:var(--turq-vlight);border-radius:10px;padding:1.25rem 1.5rem;margin:1rem 0}
  .steps ol{padding-left:1.25rem}
  .steps li{font-size:.85rem;color:var(--ink-soft);line-height:1.7;margin-bottom:.35rem}
  .steps li strong{color:var(--turq-deep)}
  .connect-btn{display:inline-block;margin-top:1rem;padding:.65rem 1.5rem;background:var(--turq);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:500;cursor:pointer;text-decoration:none;transition:opacity .2s}
  .connect-btn:hover{opacity:.88}
  /* STATES */
  .loading{padding:3rem;text-align:center;color:var(--ink-soft)}.spinner{width:28px;height:28px;border:2.5px solid var(--turq-light);border-top-color:var(--turq);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}@keyframes spin{to{transform:rotate(360deg)}}
  .empty-state{text-align:center;padding:3rem;color:var(--ink-soft);font-size:.9rem}
</style>
</head>
<body>
<aside id="sidebar" class="sidebar"></aside>

<main class="main">
  <div class="page-header">
    <div>
      <h1 id="page-title">Biblioteca</h1>
      <p style="font-size:.85rem;color:var(--ink-soft)" id="page-sub">Contenidos desde Notion</p>
    </div>
    <button class="connect-btn" onclick="load()" style="padding:.5rem 1rem;font-size:.8rem">Actualizar</button>
  </div>

  <div class="search-bar" id="search-bar" style="display:none">
    <input type="search" class="search-input" id="search" placeholder="Buscar en la biblioteca…" oninput="filterItems()">
  </div>

  <div id="container">
    <div class="loading"><div class="spinner"></div>Conectando con Notion…</div>
  </div>
</main>

<script src="/app/js/auth.js"></script>
<script src="/app/js/sidebar.js"></script>
<script>
  MM.requireAuth('admin');

  let allItems = [];
  let propKeys = [];

  function guessTitle(item) {
    for (const k of ['Nombre','nombre','Título','titulo','Title','Name','title','name']) {
      if (item[k]) return item[k];
    }
    for (const k of Object.keys(item)) {
      if (typeof item[k] === 'string' && item[k] && !['id','url','cover','icon','created','updated'].includes(k)) return item[k];
    }
    return 'Sin título';
  }

  function guessDesc(item, titleKey) {
    for (const k of ['Descripción','descripcion','Description','Sinopsis','sinopsis','Resumen','resumen','Notas','notas']) {
      if (item[k] && k !== titleKey) return item[k];
    }
    return '';
  }

  function guessTags(item, used) {
    const tags = [];
    for (const k of Object.keys(item)) {
      if (used.includes(k) || ['id','url','cover','icon','created','updated'].includes(k)) continue;
      const v = item[k];
      if (typeof v === 'string' && v && v.length < 60 && !v.startsWith('http')) tags.push(v);
    }
    return tags.slice(0, 3);
  }

  function guessUrl(item) {
    for (const k of Object.keys(item)) {
      const v = item[k];
      if (typeof v === 'string' && (v.startsWith('http://') || v.startsWith('https://'))) return v;
    }
    return item.url || null;
  }

  function renderGrid(items) {
    if (!items.length) {
      document.getElementById('container').innerHTML = '<div class="empty-state">No hay elementos que coincidan con tu búsqueda.</div>';
      return;
    }
    document.getElementById('container').innerHTML = `<div class="books-grid">${items.map(item => {
      const title = guessTitle(item);
      const desc  = guessDesc(item, Object.keys(item).find(k => item[k] === title) || '');
      const url   = guessUrl(item);
      const tags  = guessTags(item, [Object.keys(item).find(k => item[k] === title) || '', Object.keys(item).find(k => item[k] === desc) || '']);

      return `<div class="book-card">
        <div class="book-cover">
          ${item.cover ? `<img src="${item.cover}" alt="" onerror="this.parentElement.innerHTML='${item.icon || '📚'}'">` : (item.icon || '📚')}
        </div>
        <div class="book-body">
          <div class="book-title">${title}</div>
          ${tags.length ? `<div class="book-meta">${tags.map(t => `<span class="book-tag">${t}</span>`).join('')}</div>` : ''}
          ${desc ? `<div class="book-desc">${desc}</div>` : ''}
          ${url ? `<a href="${url}" target="_blank" rel="noopener" class="book-link">Ver en Notion →</a>` : `<a href="${item.url}" target="_blank" rel="noopener" class="book-link">Abrir en Notion →</a>`}
        </div>
      </div>`;
    }).join('')}</div>`;
  }

  function filterItems() {
    const q = document.getElementById('search').value.toLowerCase();
    if (!q) { renderGrid(allItems); return; }
    renderGrid(allItems.filter(item =>
      Object.values(item).some(v => typeof v === 'string' && v.toLowerCase().includes(q))
    ));
  }

  function showConnectState() {
    document.getElementById('search-bar').style.display = 'none';
    document.getElementById('container').innerHTML = `
      <div class="connect-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <h2>Conecta tu Biblioteca de Notion</h2>
        <p>La base de datos de Notion aún no está compartida con la integración de Maternal Mind. Sigue estos pasos para conectarla:</p>
        <div class="steps">
          <ol>
            <li>Abre tu base de datos en <strong>Notion</strong></li>
            <li>Haz clic en los <strong>tres puntos (...)</strong> en la esquina superior derecha</li>
            <li>Busca <strong>"Connections"</strong> o <strong>"Añadir conexiones"</strong></li>
            <li>Busca y selecciona la integración <strong>"Maternal Mind"</strong></li>
            <li>Confirma el acceso y vuelve aquí</li>
          </ol>
        </div>
        <p style="font-size:.8rem;color:var(--ink-soft);margin-top:.5rem">
          ¿No encuentras la opción? En la vista de la base de datos, prueba: Share → Add connections → Maternal Mind
        </p>
        <button class="connect-btn" onclick="load()">Reintentar conexión</button>
      </div>`;
  }

  async function load() {
    document.getElementById('container').innerHTML = '<div class="loading"><div class="spinner"></div>Conectando con Notion…</div>';
    try {
      const res  = await MM.api('/api/notion-biblioteca');
      const data = await res.json();

      if (!data.connected) {
        showConnectState();
        return;
      }

      if (data.dbTitle) {
        document.getElementById('page-title').textContent = data.dbTitle;
        document.getElementById('page-sub').textContent = `${data.items.length} elemento${data.items.length !== 1 ? 's' : ''} desde Notion`;
      }

      allItems = data.items || [];

      if (!allItems.length) {
        document.getElementById('container').innerHTML = '<div class="empty-state">La base de datos está vacía. Añade contenido en Notion y actualiza.</div>';
        return;
      }

      document.getElementById('search-bar').style.display = 'flex';
      renderGrid(allItems);
    } catch (e) {
      document.getElementById('container').innerHTML = `<div class="empty-state" style="color:var(--red)">Error al cargar: ${e.message}</div>`;
    }
  }

  load();
</script>
</body>
</html>
