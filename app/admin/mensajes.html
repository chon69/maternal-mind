<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajes · Admin · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7DCFCA;--turq-dark:#5BBFB9;--turq-deep:#4AADA7;--turq-light:#C8EDEB;--turq-vlight:#EEF9F8;--gold:#F2C14E;--gold-light:#FEF7E0;--ink:#3A3A3A;--ink-soft:#5E5E5E;--sidebar:220px;--red:#D95555;--green:#3A9A3A}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:#F4F6F8;color:var(--ink);min-height:100vh;display:flex}
  .sidebar{width:var(--sidebar);background:#fff;border-right:1px solid rgba(125,207,202,.18);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;overflow-y:auto}
  .main{margin-left:var(--sidebar);flex:1;padding:2rem;min-height:100vh}
  .page-header{margin-bottom:2rem}
  .page-header h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;font-style:italic}
  .filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.5rem}
  .filter-btn{padding:.3rem .85rem;border-radius:50px;border:1.5px solid var(--turq-light);background:#fff;color:var(--ink-soft);font-size:.78rem;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s}
  .filter-btn.active,.filter-btn:hover{background:var(--turq);border-color:var(--turq);color:#fff}
  /* INBOX */
  .msg-list{display:flex;flex-direction:column;gap:.75rem;max-width:800px}
  .msg-card{background:#fff;border:1px solid rgba(125,207,202,.18);border-radius:12px;overflow:hidden}
  .msg-card.pendiente{border-left:3px solid var(--gold)}
  .msg-card.respondido{border-left:3px solid var(--turq)}
  .msg-header{padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;cursor:pointer;user-select:none}
  .msg-header:hover{background:#FAFBFC}
  .msg-left{flex:1;min-width:0}
  .msg-client{font-size:.88rem;font-weight:500;color:var(--ink)}
  .msg-subject{font-size:.82rem;color:var(--ink-soft);margin-top:.15rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .msg-meta{display:flex;align-items:center;gap:.6rem;margin-top:.3rem}
  .msg-date{font-size:.72rem;color:var(--ink-soft)}
  .badge-estado{font-size:.65rem;font-weight:500;padding:.15rem .5rem;border-radius:50px}
  .badge-estado.pendiente{background:#FEF3C7;color:#92400E}
  .badge-estado.respondido{background:#DCFCE7;color:#166534}
  .msg-body{padding:0 1.25rem;max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s}
  .msg-body.open{padding:.75rem 1.25rem 1.25rem;max-height:1200px}
  .msg-label{font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.35rem}
  .msg-text{font-size:.86rem;line-height:1.65;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .divider{height:1px;background:rgba(125,207,202,.15);margin:1rem 0}
  .reply-existing{padding:.85rem;background:var(--turq-vlight);border-left:3px solid var(--turq);border-radius:0 8px 8px 0;margin-bottom:.85rem}
  .reply-existing .msg-label{color:var(--turq-deep)}
  .reply-area{display:flex;flex-direction:column;gap:.65rem}
  textarea.reply-input{width:100%;padding:.65rem .85rem;border:1.5px solid var(--turq-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.86rem;color:var(--ink);background:#FDFAF5;outline:none;resize:vertical;min-height:90px;transition:border-color .2s}
  textarea.reply-input:focus{border-color:var(--turq);background:#fff}
  .btn-reply{align-self:flex-end;padding:.55rem 1.2rem;background:var(--turq);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:500;cursor:pointer;transition:opacity .2s}
  .btn-reply:hover{opacity:.88}
  .btn-reply:disabled{opacity:.6;cursor:not-allowed}
  .loading{padding:2.5rem;text-align:center;color:var(--ink-soft)}.spinner{width:28px;height:28px;border:2.5px solid var(--turq-light);border-top-color:var(--turq);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .75rem}@keyframes spin{to{transform:rotate(360deg)}}
  .empty{padding:2rem 1.5rem;color:var(--ink-soft);font-size:.88rem;text-align:center}
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--ink);color:#fff;padding:.75rem 1.25rem;border-radius:10px;font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
</style>
</head>
<body>
<aside id="sidebar" class="sidebar"></aside>

<main class="main">
  <div class="page-header">
    <h1>Mensajes</h1>
    <p style="font-size:.85rem;color:var(--ink-soft)">Consultas privadas de las clientas</p>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filter('todos',this)">Todos</button>
    <button class="filter-btn" onclick="filter('pendiente',this)">Pendientes</button>
    <button class="filter-btn" onclick="filter('respondido',this)">Respondidos</button>
  </div>

  <div id="container"><div class="loading"><div class="spinner"></div>Cargando…</div></div>
</main>

<div class="toast" id="toast"></div>

<script src="/app/js/auth.js"></script>
<script src="/app/js/sidebar.js"></script>
<script>
  MM.requireAuth('admin');

  let allMsgs = [];
  let currentFilter = 'todos';
  const openCards = new Set();

  function toast(msg, ok=true) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.background = ok ? '#166534' : '#991B1B';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
  }

  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function escHtml(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function toggleCard(id) {
    const body = document.getElementById('mb-' + id);
    if (!body) return;
    if (openCards.has(id)) { openCards.delete(id); body.classList.remove('open'); }
    else { openCards.add(id); body.classList.add('open'); }
  }

  function render(msgs) {
    const el = document.getElementById('container');
    if (!msgs.length) {
      el.innerHTML = '<div class="empty">No hay mensajes en esta categoría.</div>';
      return;
    }
    el.innerHTML = `<div class="msg-list">${msgs.map(m => `
      <div class="msg-card ${m.estado}">
        <div class="msg-header" onclick="toggleCard('${m.id}')">
          <div class="msg-left">
            <div class="msg-client">${escHtml(m.cliente_nombre)} <span style="font-weight:300;color:var(--ink-soft)">&lt;${escHtml(m.cliente_email)}&gt;</span></div>
            <div class="msg-subject">${escHtml(m.asunto)}</div>
            <div class="msg-meta">
              <span class="msg-date">${fmtDate(m.created_at)}</span>
              <span class="badge-estado ${m.estado}">${m.estado === 'respondido' ? 'Respondido' : 'Pendiente'}</span>
            </div>
          </div>
        </div>
        <div class="msg-body${openCards.has(m.id) ? ' open' : ''}" id="mb-${m.id}">
          <div class="msg-label">Mensaje</div>
          <div class="msg-text">${escHtml(m.contenido)}</div>
          <div class="divider"></div>
          ${m.respuesta ? `
          <div class="reply-existing">
            <div class="msg-label">Tu respuesta</div>
            <div class="msg-text">${escHtml(m.respuesta)}</div>
          </div>` : ''}
          <div class="reply-area">
            <div class="msg-label">${m.respuesta ? 'Editar respuesta' : 'Responder'}</div>
            <textarea class="reply-input" id="rt-${m.id}" placeholder="Escribe tu respuesta…">${escHtml(m.respuesta||'')}</textarea>
            <button class="btn-reply" onclick="sendReply('${m.id}')">Enviar respuesta</button>
          </div>
        </div>
      </div>`).join('')}</div>`;
  }

  function filter(estado, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = estado;
    render(estado === 'todos' ? allMsgs : allMsgs.filter(m => m.estado === estado));
  }

  async function sendReply(id) {
    const textarea = document.getElementById('rt-' + id);
    const respuesta = textarea?.value.trim();
    if (!respuesta) { toast('Escribe una respuesta primero', false); return; }
    const btn = textarea.closest('.reply-area').querySelector('.btn-reply');
    btn.disabled = true; btn.textContent = 'Enviando…';
    try {
      const res = await MM.api('/api/admin-messages', { method:'PUT', body: JSON.stringify({ id, respuesta }) });
      if (!res.ok) throw new Error((await res.json()).error);
      toast('Respuesta enviada');
      openCards.add(id);
      await load();
    } catch(e) { toast(e.message, false); btn.disabled = false; btn.textContent = 'Enviar respuesta'; }
  }

  async function load() {
    const res = await MM.api('/api/admin-messages');
    allMsgs = await res.json();
    const activeBtn = document.querySelector('.filter-btn.active');
    filter(currentFilter, activeBtn || document.querySelector('.filter-btn'));
  }

  load();
</script>
</body>
</html>
