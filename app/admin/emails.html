<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emails · Admin · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7DCFCA;--turq-dark:#5BBFB9;--turq-deep:#4AADA7;--turq-light:#C8EDEB;--turq-vlight:#EEF9F8;--gold:#F2C14E;--gold-light:#FEF7E0;--ink:#3A3A3A;--ink-soft:#5E5E5E;--sidebar:220px;--red:#D95555;--green:#3A9A3A}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:#F4F6F8;color:var(--ink);min-height:100vh;display:flex}
  .sidebar{width:var(--sidebar);background:#fff;border-right:1px solid rgba(125,207,202,.18);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;overflow-y:auto}
  .sidebar-logo{padding:1.25rem 1.5rem;border-bottom:1px solid rgba(125,207,202,.15);display:flex;align-items:center;gap:.5rem;text-decoration:none}
  .logo-text{font-size:.9rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
  .sidebar-nav{padding:.75rem 0;flex:1}
  .nav-section{padding:.5rem 1.5rem .25rem;font-size:.6rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--turq-deep)}
  .nav-item{display:flex;align-items:center;gap:.65rem;padding:.65rem 1.5rem;font-size:.85rem;color:var(--ink-soft);text-decoration:none;transition:background .15s;border-left:3px solid transparent}
  .nav-item:hover{background:var(--turq-vlight);color:var(--turq-dark)}
  .nav-item.active{background:var(--turq-vlight);color:var(--turq-dark);border-left-color:var(--turq);font-weight:500}
  .nav-item svg{flex-shrink:0}
  .sidebar-footer{padding:1rem 1.5rem;border-top:1px solid rgba(125,207,202,.15)}
  .btn-logout{width:100%;padding:.6rem;background:none;border:1px solid var(--turq-light);border-radius:8px;color:var(--turq-dark);font-size:.8rem;font-family:'DM Sans',sans-serif;cursor:pointer}
  .main{margin-left:var(--sidebar);flex:1;padding:2rem;min-height:100vh;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:1.5rem;align-content:start}
  .col-full{grid-column:1/-1}
  .page-header{margin-bottom:0}
  .page-header h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;font-style:italic}
  /* PANELS */
  .panel{background:#fff;border-radius:14px;border:1px solid rgba(125,207,202,.15);overflow:hidden;display:flex;flex-direction:column}
  .panel-header{padding:1rem 1.25rem;border-bottom:1px solid rgba(125,207,202,.12);display:flex;align-items:center;justify-content:space-between}
  .panel-header h2{font-size:.88rem;font-weight:500}
  .panel-body{padding:1.25rem;flex:1;overflow-y:auto}
  .btn-primary{padding:.55rem 1rem;background:var(--turq);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;cursor:pointer}
  .btn-primary:hover{opacity:.88}
  label{display:block;font-size:.72rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.3rem;margin-top:.85rem}
  input[type=text],input[type=email],select,textarea{width:100%;padding:.6rem .85rem;border:1.5px solid var(--turq-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.87rem;color:var(--ink);background:#FDFAF5;outline:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{border-color:var(--turq);background:#fff}
  textarea{resize:vertical}
  .send-btn{width:100%;margin-top:1rem;padding:.7rem;background:linear-gradient(135deg,var(--turq),var(--turq-dark));color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;transition:opacity .2s}
  .send-btn:disabled{opacity:.65;cursor:not-allowed}
  /* TEMPLATES LIST */
  .tmpl-item{border:1px solid rgba(125,207,202,.15);border-radius:10px;padding:.85rem 1rem;margin-bottom:.65rem;cursor:pointer;transition:border-color .2s,background .2s}
  .tmpl-item:hover{border-color:var(--turq);background:var(--turq-vlight)}
  .tmpl-item.selected{border-color:var(--turq);background:var(--turq-vlight)}
  .tmpl-name{font-size:.88rem;font-weight:500}
  .tmpl-sub{font-size:.75rem;color:var(--ink-soft);margin-top:.2rem}
  .tmpl-actions{display:flex;gap:.4rem;margin-top:.6rem}
  .btn-sm{padding:.22rem .6rem;border-radius:6px;font-size:.7rem;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid}
  .btn-sm.danger{background:#FEF2F2;border-color:#FCA5A5;color:var(--red)}
  .btn-sm.primary{background:var(--turq-vlight);border-color:var(--turq-light);color:var(--turq-dark)}
  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .25s}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.18)}
  .modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--turq-vlight);display:flex;justify-content:space-between;align-items:center}
  .modal-header h2{font-size:1rem;font-weight:500}
  .modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--ink-soft)}
  .modal-body{padding:1.25rem 1.5rem}
  .modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--turq-vlight);display:flex;justify-content:flex-end;gap:.75rem}
  .btn-cancel{padding:.6rem 1rem;background:none;border:1px solid var(--turq-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.85rem;cursor:pointer;color:var(--ink-soft)}
  .btn-save{padding:.6rem 1.25rem;background:var(--turq);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer}
  .result-msg{padding:.65rem 1rem;border-radius:8px;font-size:.84rem;margin-top:.75rem}
  .result-msg.ok{background:#DCFCE7;color:#166534}
  .result-msg.err{background:#FEE2E2;color:#991B1B}
  .loading{text-align:center;padding:1.5rem;color:var(--ink-soft)}.spinner{width:24px;height:24px;border:2px solid var(--turq-light);border-top-color:var(--turq);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .5rem}@keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--ink);color:#fff;padding:.75rem 1.25rem;border-radius:10px;font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside id="sidebar" class="sidebar"></aside>

<main class="main">
  <div class="page-header col-full">
    <h1>Emails</h1>
    <p style="font-size:.85rem;color:var(--ink-soft)">Gestiona plantillas y envía emails a tus clientas</p>
  </div>

  <!-- LEFT: TEMPLATES -->
  <div class="panel">
    <div class="panel-header">
      <h2>Plantillas</h2>
      <button class="btn-primary" onclick="openTmplModal()">+ Nueva</button>
    </div>
    <div class="panel-body" id="tmpl-list">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- RIGHT: SEND -->
  <div class="panel">
    <div class="panel-header"><h2>Enviar email</h2></div>
    <div class="panel-body">
      <p style="font-size:.82rem;color:var(--ink-soft);margin-bottom:1rem">Selecciona una plantilla o escribe directamente.</p>
      <label>Asunto *</label>
      <input type="text" id="send-asunto" placeholder="Asunto del email">
      <label>Destinatarias</label>
      <select id="send-dest">
        <option value="all">✅ Todas las clientas activas</option>
        <option value="pendientes">⏳ Clientas pendientes (sin activar)</option>
        <option value="todas">👥 Todas (activas + pendientes)</option>
        <option value="biblioteca">📚 Plan Biblioteca MaMi</option>
        <option value="custom">✉️ Email concreto…</option>
      </select>
      <div id="send-email-wrap" hidden style="margin-top:.5rem">
        <input type="email" id="send-email" placeholder="email@ejemplo.com">
      </div>
      <div id="send-dest-count" style="font-size:.75rem;color:var(--turq-dark);margin-top:.4rem;min-height:1.1em"></div>
      <label>Cuerpo del email (HTML o texto)</label>
      <textarea id="send-body" rows="8" placeholder="Escribe el contenido aquí. Puedes usar {{nombre}} para personalizar."></textarea>
      <div style="font-size:.72rem;color:var(--ink-soft);margin-top:.35rem">💡 Usa {{nombre}} para insertar el nombre de la destinataria.</div>
      <div id="send-result" class="result-msg" hidden></div>
      <button class="send-btn" id="send-btn" onclick="sendEmail()">Enviar →</button>
    </div>
  </div>
</main>

<!-- TEMPLATE MODAL -->
<div class="modal-overlay" id="tmpl-modal" onclick="if(event.target===this)closeTmpl()">
  <div class="modal">
    <div class="modal-header"><h2 id="tmpl-modal-title">Nueva plantilla</h2><button class="modal-close" onclick="closeTmpl()">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="tmpl-id">
      <label>Nombre de la plantilla *</label>
      <input type="text" id="tmpl-nombre" placeholder="Ej: Bienvenida al Kit de Pausa">
      <label>Asunto *</label>
      <input type="text" id="tmpl-asunto" placeholder="Asunto del email">
      <label>Tipo</label>
      <select id="tmpl-tipo">
        <option value="bienvenida">Bienvenida</option>
        <option value="seguimiento">Seguimiento</option>
        <option value="evento">Evento</option>
        <option value="newsletter">Newsletter</option>
        <option value="general">General</option>
      </select>
      <label>Cuerpo (HTML o texto)</label>
      <textarea id="tmpl-cuerpo" rows="10" placeholder="Contenido del email…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeTmpl()">Cancelar</button>
      <button class="btn-save" id="tmpl-save-btn" onclick="saveTmpl()">Guardar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/app/js/auth.js"></script>
<script src="/app/js/sidebar.js"></script>
<script>
  MM.requireAuth('admin');

  function toast(msg, ok=true) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.style.background = ok ? '#166534' : '#991B1B';
    el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2800);
  }

  let allUsers = [];

  async function loadUsers() {
    try {
      const res = await MM.api('/api/admin-users');
      allUsers = await res.json();
      updateDestCount();
    } catch(e) {}
  }

  function countForGroup(group) {
    if (group === 'all')        return allUsers.filter(u => u.estado === 'activo').length;
    if (group === 'pendientes') return allUsers.filter(u => u.estado === 'pendiente').length;
    if (group === 'todas')      return allUsers.filter(u => u.estado === 'activo' || u.estado === 'pendiente').length;
    if (group === 'biblioteca') return allUsers.filter(u => u.plan === 'biblioteca_mami').length;
    return null;
  }

  function updateDestCount() {
    const group = document.getElementById('send-dest').value;
    const countEl = document.getElementById('send-dest-count');
    const n = countForGroup(group);
    countEl.textContent = n !== null ? `${n} destinataria${n !== 1 ? 's' : ''}` : '';
  }

  document.getElementById('send-dest').addEventListener('change', e => {
    document.getElementById('send-email-wrap').hidden = e.target.value !== 'custom';
    updateDestCount();
  });

  let templates = [];

  function renderTemplates() {
    const el = document.getElementById('tmpl-list');
    if (!templates.length) { el.innerHTML = '<p style="font-size:.85rem;color:var(--ink-soft)">No hay plantillas. Crea la primera.</p>'; return; }
    el.innerHTML = templates.map(t => `
      <div class="tmpl-item" onclick="loadTemplate('${t.id}')">
        <div class="tmpl-name">${t.nombre}</div>
        <div class="tmpl-sub">${t.asunto}</div>
        <div class="tmpl-actions">
          <button class="btn-sm primary" onclick="event.stopPropagation();editTmpl('${t.id}')">Editar</button>
          <button class="btn-sm danger" onclick="event.stopPropagation();deleteTmpl('${t.id}')">Eliminar</button>
        </div>
      </div>`).join('');
  }

  function loadTemplate(id) {
    const t = templates.find(t => t.id === id);
    if (!t) return;
    document.getElementById('send-asunto').value = t.asunto;
    document.getElementById('send-body').value   = t.cuerpo_html;
    document.querySelectorAll('.tmpl-item').forEach(el => el.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
  }

  function openTmplModal(t=null) {
    document.getElementById('tmpl-modal-title').textContent = t ? 'Editar plantilla' : 'Nueva plantilla';
    document.getElementById('tmpl-id').value     = t?.id||'';
    document.getElementById('tmpl-nombre').value = t?.nombre||'';
    document.getElementById('tmpl-asunto').value = t?.asunto||'';
    document.getElementById('tmpl-tipo').value   = t?.tipo||'general';
    document.getElementById('tmpl-cuerpo').value = t?.cuerpo_html||'';
    document.getElementById('tmpl-modal').classList.add('open');
    document.body.style.overflow='hidden';
  }
  function editTmpl(id) { openTmplModal(templates.find(t=>t.id===id)); }
  function closeTmpl() { document.getElementById('tmpl-modal').classList.remove('open'); document.body.style.overflow=''; }

  async function saveTmpl() {
    const id = document.getElementById('tmpl-id').value;
    const data = {
      nombre:     document.getElementById('tmpl-nombre').value.trim(),
      asunto:     document.getElementById('tmpl-asunto').value.trim(),
      tipo:       document.getElementById('tmpl-tipo').value,
      cuerpo_html:document.getElementById('tmpl-cuerpo').value,
    };
    if (!data.nombre || !data.asunto) { alert('Nombre y asunto son obligatorios'); return; }
    const btn = document.getElementById('tmpl-save-btn');
    btn.disabled=true; btn.textContent='Guardando…';
    const method = id ? 'PUT' : 'POST';
    const url    = '/api/admin-email-send';
    const body   = id ? {id,...data} : data;
    try {
      const res = await MM.api(url, { method, body: JSON.stringify(body) });
      if (!res.ok) throw new Error((await res.json()).error);
      closeTmpl(); await loadTemplates(); toast(id ? 'Plantilla actualizada' : 'Plantilla creada');
    } catch(e) { toast(e.message, false); }
    finally { btn.disabled=false; btn.textContent='Guardar'; }
  }

  async function deleteTmpl(id) {
    if (!confirm('¿Eliminar esta plantilla?')) return;
    await MM.api('/api/admin-email-send', { method:'DELETE', body: JSON.stringify({id}) });
    await loadTemplates(); toast('Plantilla eliminada');
  }

  async function sendEmail() {
    const asunto = document.getElementById('send-asunto').value.trim();
    const body   = document.getElementById('send-body').value.trim();
    const dest   = document.getElementById('send-dest').value;
    const email  = document.getElementById('send-email').value.trim();
    const msgEl  = document.getElementById('send-result');
    const btn    = document.getElementById('send-btn');

    if (!asunto || !body) { msgEl.className='result-msg err'; msgEl.textContent='Asunto y cuerpo son obligatorios.'; msgEl.hidden=false; return; }
    const destinatarios = dest === 'all' ? 'all' : email;
    if (dest === 'custom' && !email) { msgEl.className='result-msg err'; msgEl.textContent='Introduce un email.'; msgEl.hidden=false; return; }

    btn.disabled=true; btn.textContent='Enviando…'; msgEl.hidden=true;
    try {
      const res  = await MM.api('/api/admin-email-send', {
        method:'POST', body: JSON.stringify({ type: 'send', asunto, cuerpo_html: body, destinatarios }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      msgEl.className='result-msg ok';
      msgEl.textContent = `✓ Enviados: ${data.sent}${data.failed ? ` · Fallidos: ${data.failed}` : ''}`;
      msgEl.hidden=false;
    } catch(e) { msgEl.className='result-msg err'; msgEl.textContent=e.message; msgEl.hidden=false; }
    finally { btn.disabled=false; btn.textContent='Enviar →'; }
  }

  async function loadTemplates() {
    const res = await MM.api('/api/admin-email-send');
    templates = await res.json();
    renderTemplates();
  }
  loadTemplates();
  loadUsers();
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeTmpl(); });
</script>
</body>
</html>
