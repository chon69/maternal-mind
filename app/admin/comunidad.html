<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunidad · Admin · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7DCFCA;--turq-dark:#5BBFB9;--turq-deep:#4AADA7;--turq-light:#C8EDEB;--turq-vlight:#EEF9F8;--gold:#F2C14E;--gold-light:#FEF7E0;--ink:#3A3A3A;--ink-soft:#5E5E5E;--sidebar:220px;--red:#D95555;--green:#3A9A3A}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:#F4F6F8;color:var(--ink);min-height:100vh;display:flex}
  .sidebar{width:var(--sidebar);background:#fff;border-right:1px solid rgba(125,207,202,.18);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;overflow-y:auto}
  .main{margin-left:var(--sidebar);flex:1;padding:2rem;min-height:100vh}
  .page-header{margin-bottom:2rem;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem}
  .page-header h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;font-style:italic}
  .filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.5rem}
  .filter-btn{padding:.3rem .85rem;border-radius:50px;border:1.5px solid var(--turq-light);background:#fff;color:var(--ink-soft);font-size:.78rem;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s}
  .filter-btn.active,.filter-btn:hover{background:var(--turq);border-color:var(--turq);color:#fff}
  .card{background:#fff;border-radius:14px;border:1px solid rgba(125,207,202,.15);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th{font-size:.7rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:.65rem 1.25rem;text-align:left;background:#FAFBFC;border-bottom:1px solid rgba(125,207,202,.12)}
  td{font-size:.84rem;padding:.75rem 1.25rem;border-bottom:1px solid rgba(125,207,202,.08);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#FAFBFC}
  .badge{display:inline-block;font-size:.63rem;font-weight:500;padding:.2rem .55rem;border-radius:50px;text-transform:capitalize}
  .badge.general{background:var(--turq-vlight);color:var(--turq-deep)}
  .badge.eventos{background:#EDE9FE;color:#4C1D95}
  .badge.practicas{background:#DCFCE7;color:#166534}
  .post-preview{max-width:400px;font-size:.82rem;color:var(--ink-soft);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .actions{display:flex;gap:.4rem}
  .btn-sm{padding:.25rem .65rem;border-radius:6px;font-size:.72rem;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid;transition:opacity .2s;white-space:nowrap}
  .btn-sm.warn{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
  .btn-sm.danger{background:#FEF2F2;border-color:#FCA5A5;color:var(--red)}
  .loading{padding:2.5rem;text-align:center;color:var(--ink-soft)}.spinner{width:28px;height:28px;border:2.5px solid var(--turq-light);border-top-color:var(--turq);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .75rem}@keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--ink);color:#fff;padding:.75rem 1.25rem;border-radius:10px;font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
</style>
</head>
<body>
<aside id="sidebar" class="sidebar"></aside>

<main class="main">
  <div class="page-header">
    <div>
      <h1>Comunidad</h1>
      <p style="font-size:.85rem;color:var(--ink-soft)">Publicaciones de las clientas</p>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filter('todos',this)">Todos</button>
    <button class="filter-btn" onclick="filter('general',this)">General</button>
    <button class="filter-btn" onclick="filter('eventos',this)">Eventos</button>
    <button class="filter-btn" onclick="filter('practicas',this)">Prácticas</button>
    <button class="filter-btn" onclick="filter('ocultos',this)">Ocultos</button>
  </div>

  <div class="card" id="container"><div class="loading"><div class="spinner"></div>Cargando…</div></div>
</main>

<div class="toast" id="toast"></div>

<script src="/app/js/auth.js"></script>
<script src="/app/js/sidebar.js"></script>
<script>
  MM.requireAuth('admin');

  let allPosts = [];
  let currentFilter = 'todos';

  function toast(msg, ok=true) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.background = ok ? '#166534' : '#991B1B';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
  }

  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function filter(cat, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = cat;
    let filtered;
    if (cat === 'todos') filtered = allPosts.filter(p => p.activo !== 'FALSE');
    else if (cat === 'ocultos') filtered = allPosts.filter(p => p.activo === 'FALSE');
    else filtered = allPosts.filter(p => p.activo !== 'FALSE' && p.categoria === cat);
    render(filtered);
  }

  function render(posts) {
    if (!posts.length) {
      document.getElementById('container').innerHTML = '<p style="padding:2rem 1.5rem;color:var(--ink-soft);font-size:.88rem">No hay publicaciones en esta categoría.</p>';
      return;
    }
    document.getElementById('container').innerHTML = `
      <table>
        <thead><tr><th>Autora</th><th>Categoría</th><th>Mensaje</th><th>Fecha</th><th>Acciones</th></tr></thead>
        <tbody>${posts.map(p => `<tr>
          <td style="font-weight:500">${p.autor_nombre}</td>
          <td><span class="badge ${p.categoria}">${p.categoria}</span></td>
          <td><div class="post-preview" title="${p.contenido.replace(/"/g,'&quot;')}">${p.contenido}</div></td>
          <td style="font-size:.75rem;color:var(--ink-soft);white-space:nowrap">${fmtDate(p.created_at)}</td>
          <td><div class="actions">
            <button class="btn-sm warn" onclick="togglePost('${p.id}','${p.activo==='FALSE'?'TRUE':'FALSE'}')">${p.activo==='FALSE'?'Mostrar':'Ocultar'}</button>
            <button class="btn-sm danger" onclick="deletePost('${p.id}')">Eliminar</button>
          </div></td>
        </tr>`).join('')}</tbody>
      </table>`;
  }

  async function togglePost(id, activo) {
    await MM.api('/api/admin-community', { method:'PUT', body: JSON.stringify({ id, activo }) });
    await load(); toast('Visibilidad actualizada');
  }

  async function deletePost(id) {
    if (!confirm('¿Eliminar esta publicación?')) return;
    await MM.api('/api/admin-community', { method:'DELETE', body: JSON.stringify({ id }) });
    await load(); toast('Publicación eliminada');
  }

  async function load() {
    const res = await MM.api('/api/admin-community');
    allPosts = await res.json();
    filter(currentFilter, document.querySelector(`.filter-btn.active`) || document.querySelector('.filter-btn'));
  }

  load();
</script>
</body>
</html>
