<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast · Admin · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7DCFCA;--turq-dark:#5BBFB9;--turq-deep:#4AADA7;--turq-light:#C8EDEB;--turq-vlight:#EEF9F8;--gold:#F2C14E;--gold-light:#FEF7E0;--ink:#3A3A3A;--ink-soft:#5E5E5E;--sidebar:220px;--red:#D95555;--green:#3A9A3A}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:#F4F6F8;color:var(--ink);min-height:100vh;display:flex}
  .sidebar{width:var(--sidebar);background:#fff;border-right:1px solid rgba(125,207,202,.18);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;overflow-y:auto}
  .sidebar-logo{padding:1.25rem 1.5rem;border-bottom:1px solid rgba(125,207,202,.15);display:flex;align-items:center;gap:.5rem;text-decoration:none}
  .logo-text{font-size:.9rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
  .sidebar-nav{padding:.75rem 0;flex:1}
  .nav-section{padding:.5rem 1.5rem .25rem;font-size:.6rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--turq-deep)}
  .nav-item{display:flex;align-items:center;gap:.65rem;padding:.65rem 1.5rem;font-size:.85rem;color:var(--ink-soft);text-decoration:none;transition:background .15s;border-left:3px solid transparent}
  .nav-item:hover{background:var(--turq-vlight);color:var(--turq-dark)}
  .nav-item.active{background:var(--turq-vlight);color:var(--turq-dark);border-left-color:var(--turq);font-weight:500}
  .nav-item svg{flex-shrink:0}
  .sidebar-footer{padding:1rem 1.5rem;border-top:1px solid rgba(125,207,202,.15)}
  .btn-logout{width:100%;padding:.6rem;background:none;border:1px solid var(--turq-light);border-radius:8px;color:var(--turq-dark);font-size:.8rem;font-family:'DM Sans',sans-serif;cursor:pointer}
  .main{margin-left:var(--sidebar);flex:1;padding:2rem;min-height:100vh}
  .page-header{margin-bottom:2rem;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem}
  .page-header h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;font-style:italic}
  .btn-primary{padding:.65rem 1.25rem;background:var(--turq);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;transition:opacity .2s}
  .btn-primary:hover{opacity:.88}
  .card{background:#fff;border-radius:14px;border:1px solid rgba(125,207,202,.15);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th{font-size:.7rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:.65rem 1.25rem;text-align:left;background:#FAFBFC;border-bottom:1px solid rgba(125,207,202,.12)}
  td{font-size:.84rem;padding:.7rem 1.25rem;border-bottom:1px solid rgba(125,207,202,.08);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#FAFBFC}
  .badge{display:inline-block;font-size:.63rem;font-weight:500;padding:.2rem .55rem;border-radius:50px}
  .badge.activo{background:#DCFCE7;color:#166534}
  .badge.inactivo{background:#FEE2E2;color:#991B1B}
  .platform-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:2px}
  .actions{display:flex;gap:.4rem}
  .btn-sm{padding:.25rem .65rem;border-radius:6px;font-size:.72rem;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid;transition:opacity .2s}
  .btn-sm.primary{background:var(--turq-vlight);border-color:var(--turq-light);color:var(--turq-dark)}
  .btn-sm.danger{background:#FEF2F2;border-color:#FCA5A5;color:var(--red)}
  .btn-sm.warn{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .25s}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.18)}
  .modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--turq-vlight);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}
  .modal-header h2{font-size:1rem;font-weight:500}
  .modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--ink-soft)}
  .modal-body{padding:1.25rem 1.5rem}
  label{display:block;font-size:.72rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.3rem;margin-top:.9rem}
  input[type=text],input[type=url],input[type=number],select,textarea{width:100%;padding:.6rem .85rem;border:1.5px solid var(--turq-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--ink);background:#FDFAF5;outline:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{border-color:var(--turq);background:#fff}
  textarea{resize:vertical;min-height:70px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--turq-vlight);display:flex;justify-content:flex-end;gap:.75rem;position:sticky;bottom:0;background:#fff}
  .btn-cancel{padding:.6rem 1rem;background:none;border:1px solid var(--turq-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.85rem;cursor:pointer;color:var(--ink-soft)}
  .btn-save{padding:.6rem 1.25rem;background:var(--turq);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer}
  .btn-save:disabled{opacity:.65;cursor:not-allowed}
  .loading{padding:2.5rem;text-align:center;color:var(--ink-soft)}.spinner{width:28px;height:28px;border:2.5px solid var(--turq-light);border-top-color:var(--turq);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .75rem}@keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--ink);color:#fff;padding:.75rem 1.25rem;border-radius:10px;font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
</style>
</head>
<body>
<aside id="sidebar" class="sidebar"></aside>
<main class="main">
  <div class="page-header">
    <div><h1>Podcast</h1><p style="font-size:.85rem;color:var(--ink-soft)">Episodios del podcast de Maternal Mind</p></div>
    <button class="btn-primary" onclick="openModal()">+ Nuevo episodio</button>
  </div>

  <!-- Spotify show embed -->
  <div class="card" style="padding:1.25rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap">
    <div style="flex:1;min-width:220px">
      <p style="font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--turq-dark);margin-bottom:.3rem">Tu show en Spotify</p>
      <p style="font-size:.82rem;color:var(--ink-soft);font-weight:300">Escucha y comparte directamente desde aquí</p>
    </div>
    <div style="flex:2;min-width:280px">
      <iframe style="border-radius:10px" src="https://open.spotify.com/embed/show/0KlrDaWUAxp3bYQcc6ybdN?utm_source=generator" width="100%" height="96" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
  </div>

  <div class="card" id="container"><div class="loading"><div class="spinner"></div>Cargando…</div></div>
</main>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header"><h2 id="modal-title">Nuevo episodio</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="f-id">
      <label>Título *</label>
      <input type="text" id="f-titulo" placeholder="Título del episodio">
      <div class="form-row">
        <div><label>Nº Episodio</label><input type="number" id="f-num" min="1" placeholder="1"></div>
        <div><label>Temporada</label><input type="number" id="f-temp" min="1" placeholder="1"></div>
      </div>
      <label>Descripción</label>
      <textarea id="f-descripcion" rows="3" placeholder="De qué trata este episodio…"></textarea>
      <label>URL Spotify</label>
      <input type="url" id="f-spotify" placeholder="https://open.spotify.com/episode/...">
      <label>URL Apple Podcasts</label>
      <input type="url" id="f-apple" placeholder="https://podcasts.apple.com/...">
      <label>URL iVoox</label>
      <input type="url" id="f-ivoox" placeholder="https://www.ivoox.com/...">
      <label>Imagen de portada</label>
      <div style="display:flex;gap:.5rem;align-items:center">
        <input type="url" id="f-imagen" placeholder="https://… o sube una foto" style="flex:1">
        <button type="button" onclick="document.getElementById('img-file-input').click()" style="padding:.6rem .9rem;background:var(--turq-vlight);border:1.5px solid var(--turq-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--turq-dark);cursor:pointer;white-space:nowrap">📷 Subir foto</button>
        <input type="file" id="img-file-input" accept="image/*" style="display:none" onchange="uploadImage(this)">
      </div>
      <div id="img-upload-status" style="display:none;font-size:.75rem;color:var(--turq-dark);margin-top:.3rem">⏳ Subiendo imagen…</div>
      <div class="form-row" style="margin-top:.9rem">
        <div><label>Estado</label>
          <select id="f-activo">
            <option value="TRUE">Publicado</option>
            <option value="FALSE">Borrador</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" id="btn-save" onclick="save()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/app/js/auth.js"></script>
<script src="/app/js/sidebar.js"></script>
<script>
  MM.requireAuth('admin');
  let episodes = [];

  function toast(msg, ok = true) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = ok ? '#3A3A3A' : '#D95555';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* Extract Spotify episode ID from a full URL */
  function spotifyEpisodeId(url) {
    if (!url) return null;
    const m = url.match(/episode\/([A-Za-z0-9]+)/);
    return m ? m[1] : null;
  }

  function render() {
    const c = document.getElementById('container');
    if (!episodes.length) {
      c.innerHTML = '<div style="padding:2.5rem;text-align:center;color:var(--ink-soft)">No hay episodios todavía. Añade el primero.</div>';
      return;
    }
    c.innerHTML = episodes.map(ep => {
      const epId = spotifyEpisodeId(ep.url_spotify);
      const platforms = [
        ep.url_spotify ? `<a href="${ep.url_spotify}" target="_blank" style="display:inline-flex;align-items:center;gap:4px;font-size:.75rem;color:#1DB954;text-decoration:none">● Spotify</a>` : '',
        ep.url_apple   ? `<a href="${ep.url_apple}"   target="_blank" style="display:inline-flex;align-items:center;gap:4px;font-size:.75rem;color:#9B59B6;text-decoration:none">● Apple</a>` : '',
        ep.url_ivoox   ? `<a href="${ep.url_ivoox}"   target="_blank" style="display:inline-flex;align-items:center;gap:4px;font-size:.75rem;color:#F59E0B;text-decoration:none">● iVoox</a>` : '',
      ].filter(Boolean).join(' ');

      return `
        <div style="padding:1.25rem 1.5rem;border-bottom:1px solid rgba(125,207,202,.1)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.75rem;margin-bottom:.6rem">
            <div>
              <span style="font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--turq-dark)">T${ep.temporada||1} · Ep. ${ep.numero_episodio||'?'}</span>
              <h3 style="font-size:1rem;font-weight:500;color:var(--ink);margin:.2rem 0 .4rem">${ep.titulo}</h3>
              <div style="display:flex;gap:.75rem;flex-wrap:wrap;align-items:center">
                ${platforms || '<span style="font-size:.75rem;color:var(--ink-soft)">Sin plataformas</span>'}
                <span class="badge ${ep.activo==='TRUE'?'activo':'inactivo'}" style="margin-left:.25rem">${ep.activo==='TRUE'?'Publicado':'Borrador'}</span>
              </div>
              ${ep.descripcion ? `<p style="font-size:.8rem;color:var(--ink-soft);margin-top:.4rem;font-weight:300;line-height:1.5;max-width:520px">${ep.descripcion}</p>` : ''}
            </div>
            <div class="actions" style="flex-shrink:0">
              <button class="btn-sm primary" onclick="edit(episodes[${episodes.indexOf(ep)}])">Editar</button>
              <button class="btn-sm warn"    onclick="toggle('${ep.id}','${ep.activo==='TRUE'?'FALSE':'TRUE'}')">${ep.activo==='TRUE'?'Ocultar':'Publicar'}</button>
              <button class="btn-sm danger"  onclick="del('${ep.id}')">Eliminar</button>
            </div>
          </div>
          ${epId ? `<iframe style="border-radius:8px;display:block" src="https://open.spotify.com/embed/episode/${epId}?utm_source=generator" width="100%" height="80" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>` : ''}
        </div>`;
    }).join('') + '';
  }

  async function load() {
    const res = await MM.api('/api/admin-podcast');
    episodes  = await res.json();
    render();
  }

  function openModal(data = null) {
    document.getElementById('modal-title').textContent = data ? 'Editar episodio' : 'Nuevo episodio';
    document.getElementById('f-id').value      = data?.id             || '';
    document.getElementById('f-titulo').value  = data?.titulo         || '';
    document.getElementById('f-num').value     = data?.numero_episodio|| '';
    document.getElementById('f-temp').value    = data?.temporada      || '1';
    document.getElementById('f-descripcion').value = data?.descripcion|| '';
    document.getElementById('f-spotify').value = data?.url_spotify    || '';
    document.getElementById('f-apple').value   = data?.url_apple      || '';
    document.getElementById('f-ivoox').value   = data?.url_ivoox      || '';
    document.getElementById('f-imagen').value  = data?.imagen_url     || '';
    document.getElementById('f-activo').value  = data?.activo         || 'TRUE';
    document.getElementById('modal').classList.add('open');
  }

  function edit(ep) { openModal(ep); }
  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  async function save() {
    const id    = document.getElementById('f-id').value;
    const titulo= document.getElementById('f-titulo').value.trim();
    if (!titulo) { toast('El título es obligatorio', false); return; }
    const body = {
      titulo,
      numero_episodio: document.getElementById('f-num').value,
      temporada:       document.getElementById('f-temp').value,
      descripcion:     document.getElementById('f-descripcion').value,
      url_spotify:     document.getElementById('f-spotify').value,
      url_apple:       document.getElementById('f-apple').value,
      url_ivoox:       document.getElementById('f-ivoox').value,
      imagen_url:      document.getElementById('f-imagen').value,
      activo:          document.getElementById('f-activo').value,
    };
    const btn = document.getElementById('btn-save');
    btn.disabled = true; btn.textContent = 'Guardando…';
    try {
      const res = await MM.api('/api/admin-podcast', {
        method: id ? 'PUT' : 'POST',
        body: JSON.stringify(id ? { id, ...body } : body),
      });
      if (!res.ok) { const d = await res.json(); throw new Error(d.error); }
      toast(id ? 'Episodio actualizado' : 'Episodio creado');
      closeModal();
      await load();
    } catch(e) { toast(e.message, false); }
    finally { btn.disabled=false; btn.textContent='Guardar'; }
  }

  async function toggle(id, activo) {
    await MM.api('/api/admin-podcast', { method:'PUT', body: JSON.stringify({ id, activo }) });
    toast(activo==='TRUE'?'Episodio publicado':'Episodio ocultado');
    await load();
  }

  async function del(id) {
    if (!confirm('¿Eliminar este episodio?')) return;
    await MM.api('/api/admin-podcast', { method:'DELETE', body: JSON.stringify({ id }) });
    toast('Episodio eliminado');
    await load();
  }

  async function uploadImage(input) {
    const file = input.files[0];
    if (!file) return;
    const status = document.getElementById('img-upload-status');
    status.style.display = 'block';
    try {
      const data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = e => resolve(e.target.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const res = await MM.api('/api/admin-upload', {
        method: 'POST',
        body: JSON.stringify({ filename: file.name, mimeType: file.type, data }),
      });
      if (!res.ok) throw new Error((await res.json()).error);
      const { url } = await res.json();
      document.getElementById('f-imagen').value = url;
      toast('Imagen subida correctamente');
    } catch(e) {
      toast('Error al subir la imagen: ' + e.message, false);
    } finally {
      status.style.display = 'none';
      input.value = '';
    }
  }

  document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });
  load();
</script>
</body>
</html>
