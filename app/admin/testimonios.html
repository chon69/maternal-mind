<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonios · Admin · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7DCFCA;--turq-dark:#5BBFB9;--turq-deep:#4AADA7;--turq-light:#C8EDEB;--turq-vlight:#EEF9F8;--gold:#F2C14E;--gold-light:#FEF7E0;--ink:#3A3A3A;--ink-soft:#5E5E5E;--sidebar:220px;--red:#D95555;--green:#3A9A3A}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:#F4F6F8;color:var(--ink);min-height:100vh;display:flex}
  .sidebar{width:var(--sidebar);background:#fff;border-right:1px solid rgba(125,207,202,.18);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;overflow-y:auto}
  .sidebar-logo{padding:1.25rem 1.5rem;border-bottom:1px solid rgba(125,207,202,.15);display:flex;align-items:center;gap:.5rem;text-decoration:none}
  .logo-text{font-size:.9rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
  .sidebar-nav{padding:.75rem 0;flex:1}
  .nav-section{padding:.5rem 1.5rem .25rem;font-size:.6rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--turq-deep)}
  .nav-item{display:flex;align-items:center;gap:.65rem;padding:.65rem 1.5rem;font-size:.85rem;color:var(--ink-soft);text-decoration:none;transition:background .15s;border-left:3px solid transparent}
  .nav-item:hover{background:var(--turq-vlight);color:var(--turq-dark)}
  .nav-item.active{background:var(--turq-vlight);color:var(--turq-dark);border-left-color:var(--turq);font-weight:500}
  .nav-item svg{flex-shrink:0}
  .sidebar-footer{padding:1rem 1.5rem;border-top:1px solid rgba(125,207,202,.15)}
  .btn-logout{width:100%;padding:.6rem;background:none;border:1px solid var(--turq-light);border-radius:8px;color:var(--turq-dark);font-size:.8rem;font-family:'DM Sans',sans-serif;cursor:pointer}
  .main{margin-left:var(--sidebar);flex:1;padding:2rem;min-height:100vh;max-width:1000px}
  .page-header{margin-bottom:1.5rem}
  .page-header h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;font-style:italic}
  .page-header p{font-size:.85rem;color:var(--ink-soft)}
  .card{background:#fff;border-radius:14px;border:1px solid rgba(125,207,202,.15);overflow:hidden}
  /* FORM */
  .form-card{background:#fff;border-radius:14px;border:1px solid rgba(125,207,202,.2);padding:1.5rem;margin-bottom:1.75rem}
  .form-card h2{font-size:.95rem;font-weight:500;margin-bottom:1rem}
  label{display:block;font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.3rem;margin-top:.9rem}
  label:first-of-type{margin-top:0}
  input[type=text],textarea{width:100%;padding:.65rem .85rem;border:1.5px solid var(--turq-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--ink);background:#FDFAF5;outline:none;transition:border-color .2s}
  input[type=text]:focus,textarea:focus{border-color:var(--turq);background:#fff}
  textarea{resize:vertical;min-height:110px;line-height:1.6}
  .hint{font-size:.72rem;color:var(--ink-soft);margin-top:.25rem}
  .check-row{display:flex;align-items:center;gap:.5rem;margin-top:1rem}
  .check-row input{width:auto;accent-color:var(--turq)}
  .check-row label{margin:0;text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--ink)}
  .form-actions{display:flex;gap:.6rem;margin-top:1.25rem}
  .btn{padding:.6rem 1.4rem;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;border:none;transition:opacity .2s}
  .btn-primary{background:var(--turq);color:#fff}.btn-primary:hover{opacity:.88}.btn-primary:disabled{opacity:.6;cursor:not-allowed}
  .btn-ghost{background:none;border:1px solid var(--turq-light);color:var(--ink-soft)}
  /* TABLE */
  table{width:100%;border-collapse:collapse}
  th{font-size:.7rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:.65rem 1.25rem;text-align:left;background:#FAFBFC;border-bottom:1px solid rgba(125,207,202,.12)}
  td{font-size:.84rem;padding:.75rem 1.25rem;border-bottom:1px solid rgba(125,207,202,.08);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#FAFBFC}
  .badge{display:inline-block;font-size:.63rem;font-weight:600;padding:.2rem .55rem;border-radius:50px}
  .badge.on{background:#DCFCE7;color:#166534}
  .badge.off{background:#FEF2F2;color:var(--red)}
  .badge.star{background:var(--gold-light);color:#B8820A}
  .tst-preview{max-width:420px;font-size:.82rem;color:var(--ink-soft);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .actions{display:flex;gap:.4rem;flex-wrap:wrap}
  .btn-sm{padding:.25rem .65rem;border-radius:6px;font-size:.72rem;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid;transition:opacity .2s;white-space:nowrap;background:#fff}
  .btn-sm.edit{border-color:var(--turq-light);color:var(--turq-deep)}
  .btn-sm.warn{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
  .btn-sm.danger{background:#FEF2F2;border-color:#FCA5A5;color:var(--red)}
  .loading{padding:2.5rem;text-align:center;color:var(--ink-soft)}.spinner{width:28px;height:28px;border:2.5px solid var(--turq-light);border-top-color:var(--turq);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .75rem}@keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--ink);color:#fff;padding:.75rem 1.25rem;border-radius:10px;font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
</style>
</head>
<body>
<aside id="sidebar" class="sidebar"></aside>

<main class="main">
  <div class="page-header">
    <h1>Testimonios</h1>
    <p>Historias de transformación que verán las madres en la web y en la plataforma.</p>
  </div>

  <div class="form-card">
    <h2 id="form-title">Nuevo testimonio</h2>
    <input type="hidden" id="f-id">
    <label>Nombre</label>
    <input type="text" id="f-nombre" placeholder="Ej: Laura · o 'Una mamá de Maternal Mind'" maxlength="80">
    <label>Contexto <span style="text-transform:none;font-weight:400;color:var(--ink-soft)">(opcional)</span></label>
    <input type="text" id="f-contexto" placeholder="Ej: Mamá de dos · Círculo de enero" maxlength="120">
    <div class="hint">Una línea corta que da credibilidad. Puedes dejarla vacía.</div>
    <label>Testimonio</label>
    <textarea id="f-testimonio" placeholder="Lo que esta madre vivió y cómo la transformó Maternal Mind…" maxlength="1500"></textarea>
    <div class="check-row">
      <input type="checkbox" id="f-destacado">
      <label for="f-destacado">Destacar (aparece el primero, resaltado)</label>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="save-btn" onclick="save()">Publicar testimonio</button>
      <button class="btn btn-ghost" id="cancel-btn" onclick="resetForm()" style="display:none">Cancelar edición</button>
    </div>
  </div>

  <div class="card" id="container"><div class="loading"><div class="spinner"></div>Cargando…</div></div>
</main>

<div class="toast" id="toast"></div>

<script src="/app/js/auth.js"></script>
<script src="/app/js/sidebar.js"></script>
<script>
  MM.requireAuth('admin');
  let all = [];

  function toast(msg, ok=true){
    const el=document.getElementById('toast');
    el.textContent=msg; el.style.background=ok?'#166534':'#991B1B';
    el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2800);
  }
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fmtDate(iso){return new Date(iso).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});}

  function render(){
    const c=document.getElementById('container');
    if(!all.length){c.innerHTML='<p style="padding:2rem 1.5rem;color:var(--ink-soft);font-size:.88rem">Aún no hay testimonios. Añade el primero con el formulario de arriba.</p>';return;}
    c.innerHTML=`<table><thead><tr><th>Nombre</th><th>Testimonio</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody>${all.map(t=>`<tr>
      <td style="font-weight:500">${esc(t.nombre)}${t.contexto?`<div style="font-size:.72rem;color:var(--ink-soft);font-weight:400;margin-top:.15rem">${esc(t.contexto)}</div>`:''}</td>
      <td><div class="tst-preview" title="${esc(t.testimonio).replace(/"/g,'&quot;')}">${esc(t.testimonio)}</div></td>
      <td style="white-space:nowrap">${t.destacado==='TRUE'?'<span class="badge star">★ Destacado</span> ':''}${t.activo==='FALSE'?'<span class="badge off">Oculto</span>':'<span class="badge on">Visible</span>'}</td>
      <td style="font-size:.75rem;color:var(--ink-soft);white-space:nowrap">${fmtDate(t.created_at)}</td>
      <td><div class="actions">
        <button class="btn-sm edit" onclick="edit('${t.id}')">Editar</button>
        <button class="btn-sm warn" onclick="toggle('${t.id}','${t.activo==='FALSE'?'TRUE':'FALSE'}')">${t.activo==='FALSE'?'Mostrar':'Ocultar'}</button>
        <button class="btn-sm danger" onclick="del('${t.id}')">Eliminar</button>
      </div></td></tr>`).join('')}</tbody></table>`;
  }

  function resetForm(){
    document.getElementById('f-id').value='';
    document.getElementById('f-nombre').value='';
    document.getElementById('f-contexto').value='';
    document.getElementById('f-testimonio').value='';
    document.getElementById('f-destacado').checked=false;
    document.getElementById('form-title').textContent='Nuevo testimonio';
    document.getElementById('save-btn').textContent='Publicar testimonio';
    document.getElementById('cancel-btn').style.display='none';
  }

  function edit(id){
    const t=all.find(x=>x.id===id); if(!t)return;
    document.getElementById('f-id').value=t.id;
    document.getElementById('f-nombre').value=t.nombre||'';
    document.getElementById('f-contexto').value=t.contexto||'';
    document.getElementById('f-testimonio').value=t.testimonio||'';
    document.getElementById('f-destacado').checked=t.destacado==='TRUE';
    document.getElementById('form-title').textContent='Editar testimonio';
    document.getElementById('save-btn').textContent='Guardar cambios';
    document.getElementById('cancel-btn').style.display='inline-block';
    window.scrollTo({top:0,behavior:'smooth'});
  }

  async function save(){
    const id=document.getElementById('f-id').value;
    const nombre=document.getElementById('f-nombre').value.trim();
    const contexto=document.getElementById('f-contexto').value.trim();
    const testimonio=document.getElementById('f-testimonio').value.trim();
    const destacado=document.getElementById('f-destacado').checked?'TRUE':'FALSE';
    if(!nombre){toast('Escribe un nombre',false);return;}
    if(!testimonio){toast('Escribe el testimonio',false);return;}
    const btn=document.getElementById('save-btn'); btn.disabled=true;
    try{
      if(id){
        await MM.api('/api/admin-testimonios',{method:'PUT',body:JSON.stringify({id,nombre,contexto,testimonio,destacado})});
        toast('Testimonio actualizado');
      }else{
        const res=await MM.api('/api/admin-testimonios',{method:'POST',body:JSON.stringify({nombre,contexto,testimonio,destacado})});
        if(!res.ok)throw new Error((await res.json()).error);
        toast('Testimonio publicado');
      }
      resetForm(); await load();
    }catch(e){toast(e.message||'Error al guardar',false);}
    finally{btn.disabled=false;}
  }

  async function toggle(id,activo){
    await MM.api('/api/admin-testimonios',{method:'PUT',body:JSON.stringify({id,activo})});
    await load(); toast('Visibilidad actualizada');
  }
  async function del(id){
    if(!confirm('¿Eliminar este testimonio? No se puede deshacer.'))return;
    await MM.api('/api/admin-testimonios',{method:'DELETE',body:JSON.stringify({id})});
    await load(); toast('Testimonio eliminado');
  }
  async function load(){
    const res=await MM.api('/api/admin-testimonios');
    all=await res.json(); render();
  }
  load();
</script>
</body>
</html>
