<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarias · Admin · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7AACB0;--turq-dark:#5B9298;--turq-deep:#4A8A8E;--turq-light:#C2D9DB;--turq-vlight:#EDF4F5;--gold:#C4A882;--gold-light:#F5EFE6;--ink:#3A3A3A;--ink-soft:#5E5E5E;--cream:#FDFAF5;--sidebar:220px;--red:#D95555;--green:#3A9A3A}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:#F4F6F8;color:var(--ink);min-height:100vh;display:flex}
  .sidebar{width:var(--sidebar);background:#fff;border-right:1px solid rgba(122,172,176,.18);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;overflow-y:auto}
  .sidebar-logo{padding:1.25rem 1.5rem;border-bottom:1px solid rgba(122,172,176,.15);display:flex;align-items:center;gap:.5rem;text-decoration:none}
  .logo-text{font-size:.9rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
  .sidebar-nav{padding:.75rem 0;flex:1}
  .nav-section{padding:.5rem 1.5rem .25rem;font-size:.6rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--turq-deep)}
  .nav-item{display:flex;align-items:center;gap:.65rem;padding:.65rem 1.5rem;font-size:.85rem;color:var(--ink-soft);text-decoration:none;transition:background .15s,color .15s;border-left:3px solid transparent}
  .nav-item:hover{background:var(--turq-vlight);color:var(--turq-dark)}
  .nav-item.active{background:var(--turq-vlight);color:var(--turq-dark);border-left-color:var(--turq);font-weight:500}
  .nav-item svg{flex-shrink:0}
  .sidebar-footer{padding:1rem 1.5rem;border-top:1px solid rgba(122,172,176,.15)}
  .btn-logout{width:100%;padding:.6rem;background:none;border:1px solid var(--turq-light);border-radius:8px;color:var(--turq-dark);font-size:.8rem;font-family:'DM Sans',sans-serif;cursor:pointer}
  .btn-logout:hover{background:var(--turq-vlight)}
  .main{margin-left:var(--sidebar);flex:1;padding:2rem;min-height:100vh}
  .page-header{margin-bottom:2rem;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem}
  .page-header h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;font-style:italic}
  /* SEARCH + FILTER */
  .toolbar{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1.5rem}
  .search-input{padding:.6rem 1rem;border:1.5px solid var(--turq-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--ink);background:#fff;outline:none;min-width:220px}
  .search-input:focus{border-color:var(--turq)}
  select.filter-sel{padding:.6rem .75rem;border:1.5px solid var(--turq-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.82rem;color:var(--ink-soft);background:#fff;cursor:pointer;outline:none}
  .card{background:#fff;border-radius:14px;border:1px solid rgba(122,172,176,.15);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th{font-size:.7rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:.65rem 1.25rem;text-align:left;background:#FAFBFC;border-bottom:1px solid rgba(122,172,176,.12)}
  td{font-size:.84rem;padding:.7rem 1.25rem;border-bottom:1px solid rgba(122,172,176,.08);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#FAFBFC}
  .badge{display:inline-block;font-size:.65rem;font-weight:500;padding:.2rem .55rem;border-radius:50px;text-transform:uppercase;letter-spacing:.06em}
  .badge.activo{background:#DCFCE7;color:#166534}.badge.pendiente{background:#FEF9C3;color:#854D0E}.badge.inactivo{background:#FEE2E2;color:#991B1B}
  .badge.admin{background:var(--gold-light);color:#7A5C2A}.badge.client{background:var(--turq-vlight);color:var(--turq-deep)}
  .actions{display:flex;gap:.4rem;flex-wrap:wrap}
  .btn-sm{padding:.28rem .7rem;border-radius:6px;font-size:.72rem;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid;transition:opacity .2s}
  .btn-sm:hover{opacity:.75}
  .btn-sm.danger{background:#FEF2F2;border-color:#FCA5A5;color:var(--red)}
  .btn-sm.primary{background:var(--turq-vlight);border-color:var(--turq-light);color:var(--turq-dark)}
  .btn-sm.warn{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
  .loading{padding:2.5rem;text-align:center;color:var(--ink-soft)}.spinner{width:28px;height:28px;border:2.5px solid var(--turq-light);border-top-color:var(--turq);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .75rem}@keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--ink);color:#fff;padding:.75rem 1.25rem;border-radius:10px;font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<aside id="sidebar" class="sidebar"></aside>

<main class="main">
  <div class="page-header">
    <div><h1>Usuarias</h1><p style="font-size:.85rem;color:var(--ink-soft)">Gestiona todas las usuarias registradas</p></div>
  </div>

  <div class="toolbar">
    <input type="search" class="search-input" id="search" placeholder="Buscar por nombre o email…" oninput="filterTable()">
    <select class="filter-sel" id="filter-estado" onchange="filterTable()">
      <option value="">Todos los estados</option>
      <option value="activo">Activo</option>
      <option value="pendiente">Pendiente</option>
      <option value="inactivo">Inactivo</option>
    </select>
    <select class="filter-sel" id="filter-role" onchange="filterTable()">
      <option value="">Todos los roles</option>
      <option value="client">Cliente</option>
      <option value="admin">Admin</option>
    </select>
  </div>

  <div class="card" id="table-wrap">
    <div class="loading"><div class="spinner"></div>Cargando usuarias…</div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="/app/js/auth.js"></script>
<script src="/app/js/sidebar.js"></script>
<script>
  MM.requireAuth('admin');
  let allUsers = [];

  function toast(msg, ok=true) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.background = ok ? '#166534' : '#991B1B';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
  }

  function filterTable() {
    const q      = document.getElementById('search').value.toLowerCase();
    const estado = document.getElementById('filter-estado').value;
    const role   = document.getElementById('filter-role').value;
    const filtered = allUsers.filter(u =>
      (!q || u.nombre.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)) &&
      (!estado || u.estado === estado) &&
      (!role   || u.role   === role)
    );
    renderTable(filtered);
  }

  function renderTable(users) {
    if (!users.length) {
      document.getElementById('table-wrap').innerHTML = '<p style="padding:2rem 1.5rem;color:var(--ink-soft);font-size:.88rem">No hay usuarias que coincidan.</p>';
      return;
    }
    document.getElementById('table-wrap').innerHTML = `
      <table>
        <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Registrada</th><th>Últ. acceso</th><th>Acciones</th></tr></thead>
        <tbody>${users.map(u => `<tr id="row-${u.id}">
          <td><strong>${u.nombre}</strong></td>
          <td style="color:var(--ink-soft)">${u.email}</td>
          <td><span class="badge ${u.role}">${u.role}</span></td>
          <td><span class="badge ${u.estado}">${u.estado}</span></td>
          <td style="font-size:.75rem;color:var(--ink-soft)">${u.created_at ? new Date(u.created_at).toLocaleDateString('es-ES') : '—'}</td>
          <td style="font-size:.75rem;color:var(--ink-soft)">${u.last_login ? new Date(u.last_login).toLocaleDateString('es-ES') : '—'}</td>
          <td><div class="actions">
            ${u.estado === 'activo'
              ? `<button class="btn-sm warn" onclick="toggleEstado('${u.id}','inactivo')">Desactivar</button>`
              : `<button class="btn-sm primary" onclick="toggleEstado('${u.id}','activo')">Activar</button>`}
            ${u.role === 'client'
              ? `<button class="btn-sm primary" onclick="setRole('${u.id}','admin')">→ Admin</button>`
              : `<button class="btn-sm warn" onclick="setRole('${u.id}','client')">→ Cliente</button>`}
            <button class="btn-sm danger" onclick="deleteUser('${u.id}','${u.nombre}')">Eliminar</button>
          </div></td>
        </tr>`).join('')}</tbody>
      </table>`;
  }

  async function toggleEstado(id, estado) {
    const res = await MM.api('/api/admin-users', { method:'PUT', body: JSON.stringify({ id, estado }) });
    if (res.ok) {
      const u = allUsers.find(u => u.id === id);
      if (u) u.estado = estado;
      filterTable();
      toast(`Estado actualizado a "${estado}"`);
    } else toast('Error al actualizar', false);
  }

  async function setRole(id, role) {
    const res = await MM.api('/api/admin-users', { method:'PUT', body: JSON.stringify({ id, role }) });
    if (res.ok) {
      const u = allUsers.find(u => u.id === id);
      if (u) u.role = role;
      filterTable();
      toast(`Rol actualizado a "${role}"`);
    } else toast('Error al actualizar', false);
  }

  async function deleteUser(id, nombre) {
    if (!confirm(`¿Eliminar a ${nombre}? Esta acción no se puede deshacer.`)) return;
    const res = await MM.api('/api/admin-users', { method:'DELETE', body: JSON.stringify({ id }) });
    if (res.ok) {
      allUsers = allUsers.filter(u => u.id !== id);
      filterTable();
      toast(`${nombre} eliminada`);
    } else toast('Error al eliminar', false);
  }

  async function load() {
    const res = await MM.api('/api/admin-users');
    allUsers  = await res.json();
    allUsers.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    filterTable();
  }
  load();
</script>
</body>
</html>
