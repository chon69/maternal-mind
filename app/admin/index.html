<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7AACB0;--turq-dark:#5B9298;--turq-deep:#4A8A8E;--turq-light:#C2D9DB;--turq-vlight:#EDF4F5;--gold:#C4A882;--gold-light:#F5EFE6;--ink:#3A3A3A;--ink-soft:#5E5E5E;--cream:#FDFAF5;--sidebar:220px;--red:#D95555;--green:#3A9A3A}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:#F4F6F8;color:var(--ink);min-height:100vh;display:flex}
  /* SIDEBAR */
  .sidebar{width:var(--sidebar);background:#fff;border-right:1px solid rgba(122,172,176,.18);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;overflow-y:auto}
  .sidebar-logo{padding:1.25rem 1.5rem;border-bottom:1px solid rgba(122,172,176,.15);display:flex;align-items:center;gap:.5rem;text-decoration:none}
  .logo-text{font-size:.9rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
  .sidebar-nav{padding:.75rem 0;flex:1}
  .nav-section{padding:.5rem 1.5rem .25rem;font-size:.6rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--turq-deep)}
  .nav-item{display:flex;align-items:center;gap:.65rem;padding:.65rem 1.5rem;font-size:.85rem;color:var(--ink-soft);text-decoration:none;transition:background .15s,color .15s;border-left:3px solid transparent}
  .nav-item:hover{background:var(--turq-vlight);color:var(--turq-dark)}
  .nav-item.active{background:var(--turq-vlight);color:var(--turq-dark);border-left-color:var(--turq);font-weight:500}
  .nav-item svg{flex-shrink:0}
  .sidebar-footer{padding:1rem 1.5rem;border-top:1px solid rgba(122,172,176,.15)}
  .btn-logout{width:100%;padding:.6rem;background:none;border:1px solid var(--turq-light);border-radius:8px;color:var(--turq-dark);font-size:.8rem;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .2s}
  .btn-logout:hover{background:var(--turq-vlight)}
  /* MAIN */
  .main{margin-left:var(--sidebar);flex:1;padding:2rem;min-height:100vh}
  .page-header{margin-bottom:2rem}
  .page-header h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;font-style:italic;margin-bottom:.25rem}
  .page-header p{font-size:.88rem;color:var(--ink-soft);font-weight:300}
  /* STATS */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem;margin-bottom:2.5rem}
  .stat-card{background:#fff;border-radius:14px;padding:1.25rem;border:1px solid rgba(122,172,176,.15)}
  .stat-label{font-size:.7rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.4rem}
  .stat-value{font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:300;color:var(--turq-dark);line-height:1}
  .stat-sub{font-size:.72rem;color:var(--ink-soft);margin-top:.3rem}
  /* CALENDAR */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-day-name{font-size:.62rem;font-weight:600;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding:.3rem 0;letter-spacing:.04em}
  .cal-day{border-radius:8px;min-height:62px;padding:.3rem .35rem;background:#FAFBFC;border:1px solid rgba(122,172,176,.08);position:relative}
  .cal-day.today{background:var(--turq-vlight);border-color:var(--turq-light)}
  .cal-day.empty{background:transparent;border-color:transparent;min-height:0}
  .cal-day-num{font-weight:500;color:var(--ink-soft);font-size:.7rem;line-height:1}
  .cal-day.today .cal-day-num{color:var(--turq-dark);font-weight:700}
  .cal-event{font-size:.58rem;border-radius:4px;padding:.1rem .3rem;margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:#fff}
  .cal-event.circulo{background:#065F46}
  .cal-event.taller{background:var(--turq-dark)}
  .cal-event.curso{background:#4C1D95}
  .cal-event.programa{background:#166534}
  .cal-event.retiro{background:#7A5C2A}
  /* TABLE */
  .card{background:#fff;border-radius:14px;border:1px solid rgba(122,172,176,.15);overflow:hidden;margin-bottom:1.5rem}
  .card-header{padding:1rem 1.5rem;border-bottom:1px solid rgba(122,172,176,.12);display:flex;align-items:center;justify-content:space-between}
  .card-header h2{font-size:.88rem;font-weight:500;color:var(--ink)}
  table{width:100%;border-collapse:collapse}
  th{font-size:.7rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:.65rem 1.25rem;text-align:left;background:#FAFBFC;border-bottom:1px solid rgba(122,172,176,.12)}
  td{font-size:.85rem;padding:.75rem 1.25rem;border-bottom:1px solid rgba(122,172,176,.08);color:var(--ink);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#FAFBFC}
  .badge{display:inline-block;font-size:.65rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .55rem;border-radius:50px}
  .badge.activo{background:#DCFCE7;color:#166534}
  .badge.pendiente{background:#FEF9C3;color:#854D0E}
  .badge.inactivo{background:#FEE2E2;color:#991B1B}
  .badge.admin{background:var(--gold-light);color:#7A5C2A}
  .badge.client{background:var(--turq-vlight);color:var(--turq-deep)}
  .btn-sm{padding:.3rem .75rem;border-radius:6px;font-size:.75rem;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid;transition:opacity .2s}
  .btn-sm:hover{opacity:.8}
  .btn-sm.danger{background:#FEF2F2;border-color:#FCA5A5;color:var(--red)}
  .btn-sm.primary{background:var(--turq-vlight);border-color:var(--turq-light);color:var(--turq-dark)}
  .loading{padding:2.5rem;text-align:center;color:var(--ink-soft);font-size:.88rem}
  .spinner{width:28px;height:28px;border:2.5px solid var(--turq-light);border-top-color:var(--turq);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}@keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:768px){.sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap}.main{margin-left:0}}
</style>
</head>
<body>
<aside id="sidebar" class="sidebar"></aside>

<main class="main">
  <div class="page-header">
    <h1 id="welcome">Buenos días 🌿</h1>
    <p>Panel de administración de Maternal Mind</p>
  </div>

  <div class="stats-grid" id="stats">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 id="cal-title">Calendario</h2>
      <div style="display:flex;gap:.4rem;align-items:center">
        <button onclick="prevMonth()" style="padding:.25rem .65rem;border-radius:6px;font-size:.8rem;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--turq-light);background:var(--turq-vlight);color:var(--turq-dark)">‹</button>
        <button onclick="nextMonth()" style="padding:.25rem .65rem;border-radius:6px;font-size:.8rem;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--turq-light);background:var(--turq-vlight);color:var(--turq-dark)">›</button>
        <a href="/app/admin/eventos.html" style="font-size:.8rem;color:var(--turq-dark);text-decoration:none;margin-left:.5rem">Gestionar →</a>
      </div>
    </div>
    <div style="padding:1rem 1.25rem" id="cal-container">
      <div class="loading"><div class="spinner"></div>Cargando…</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Últimas registradas</h2>
      <a href="/app/admin/usuarios.html" style="font-size:.8rem;color:var(--turq-dark);text-decoration:none">Ver todas →</a>
    </div>
    <div id="recent-table">
      <div class="loading"><div class="spinner"></div>Cargando…</div>
    </div>
  </div>
</main>

<script src="/app/js/auth.js"></script>
<script src="/app/js/sidebar.js"></script>
<script>
  const user = MM.requireAuth('admin');
  if (user) {
    const h = new Date().getHours();
    const g = h < 12 ? 'Buenos días' : h < 18 ? 'Buenas tardes' : 'Buenas noches';
    document.getElementById('welcome').textContent = `${g}, ${user.nombre.split(' ')[0]} 🌿`;
  }

  async function load() {
    const res   = await MM.api('/api/admin-users');
    const users = await res.json();

    // Stats
    const total    = users.length;
    const activos  = users.filter(u => u.estado === 'activo').length;
    const pending  = users.filter(u => u.estado === 'pendiente').length;
    const thisMonth = users.filter(u => {
      const d = new Date(u.created_at);
      const n = new Date();
      return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
    }).length;

    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="stat-label">Total usuarias</div><div class="stat-value">${total}</div></div>
      <div class="stat-card"><div class="stat-label">Activas</div><div class="stat-value">${activos}</div><div class="stat-sub">Han activado su cuenta</div></div>
      <div class="stat-card"><div class="stat-label">Pendientes</div><div class="stat-value">${pending}</div><div class="stat-sub">Sin activar aún</div></div>
      <div class="stat-card"><div class="stat-label">Este mes</div><div class="stat-value">${thisMonth}</div><div class="stat-sub">Nuevas registradas</div></div>`;

    // Recent 10
    const recent = [...users].sort((a,b) => new Date(b.created_at)-new Date(a.created_at)).slice(0,10);
    document.getElementById('recent-table').innerHTML = `
      <table>
        <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Registrada</th></tr></thead>
        <tbody>${recent.map(u => `<tr>
          <td>${u.nombre}</td>
          <td style="color:var(--ink-soft)">${u.email}</td>
          <td><span class="badge ${u.role}">${u.role}</span></td>
          <td><span class="badge ${u.estado}">${u.estado}</span></td>
          <td style="color:var(--ink-soft);font-size:.78rem">${u.created_at ? new Date(u.created_at).toLocaleDateString('es-ES') : '—'}</td>
        </tr>`).join('')}</tbody>
      </table>`;
  }

  load().catch(() => {
    document.getElementById('stats').innerHTML = '<p style="color:var(--red);font-size:.85rem">Error al cargar datos.</p>';
  });

  // CALENDAR
  let calDate = new Date();
  let calEvents = [];

  const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  function renderCalendar() {
    const y = calDate.getFullYear(), m = calDate.getMonth();
    document.getElementById('cal-title').textContent = `${MONTHS[m]} ${y}`;

    const firstDow = new Date(y, m, 1).getDay();
    const offset   = firstDow === 0 ? 6 : firstDow - 1;
    const days     = new Date(y, m + 1, 0).getDate();
    const today    = new Date();
    const isNow    = today.getFullYear() === y && today.getMonth() === m;

    const byDay = {};
    calEvents.forEach(ev => {
      if (!ev.fecha_inicio) return;
      const [ey, em, ed] = ev.fecha_inicio.split('T')[0].split('-').map(Number);
      if (ey === y && em - 1 === m) { (byDay[ed] = byDay[ed] || []).push(ev); }
    });

    let html = '<div class="cal-grid">';
    ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d => { html += `<div class="cal-day-name">${d}</div>`; });
    for (let i = 0; i < offset; i++) html += '<div class="cal-day empty"></div>';
    for (let d = 1; d <= days; d++) {
      const cls = (isNow && today.getDate() === d) ? ' today' : '';
      const evs = byDay[d] || [];
      html += `<div class="cal-day${cls}"><div class="cal-day-num">${d}</div>
        ${evs.slice(0,3).map(ev => `<div class="cal-event ${ev.tipo||''}" title="${ev.titulo}">${ev.titulo}</div>`).join('')}
        ${evs.length > 3 ? `<div style="font-size:.55rem;color:var(--ink-soft);margin-top:.15rem">+${evs.length-3} más</div>` : ''}
      </div>`;
    }
    html += '</div>';
    document.getElementById('cal-container').innerHTML = html;
  }

  function prevMonth() { calDate = new Date(calDate.getFullYear(), calDate.getMonth() - 1, 1); renderCalendar(); }
  function nextMonth() { calDate = new Date(calDate.getFullYear(), calDate.getMonth() + 1, 1); renderCalendar(); }

  MM.api('/api/admin-events').then(r => r.json()).then(data => {
    calEvents = data;
    renderCalendar();
  }).catch(() => renderCalendar());
</script>
</body>
</html>
