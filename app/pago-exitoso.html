<style>
  :root{--turq:#7DCFCA;--turq-dark:#5BBFB9;--turq-light:#C8EDEB;--turq-vlight:#EEF9F8;--gold:#F2C14E;--gold-light:#FEF7E0;--ink:#3A3A3A;--ink-soft:#5E5E5E;--cream:#FDFAF5}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
  .card{background:#fff;border-radius:24px;padding:3.5rem 3rem;max-width:480px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(125,207,202,.18)}
  .icon{font-size:4rem;margin-bottom:1.5rem}
  h1{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:300;font-style:italic;color:var(--ink);margin-bottom:.75rem;line-height:1.2}
  p{font-size:.95rem;color:var(--ink-soft);line-height:1.75;font-weight:300;margin-bottom:.5rem}
  .divider{width:60px;height:2px;background:linear-gradient(135deg,var(--turq),var(--gold));margin:1.75rem auto}
  .btn{display:inline-block;background:linear-gradient(135deg,var(--turq),var(--turq-dark));color:#fff;text-decoration:none;padding:.85rem 2rem;border-radius:10px;font-size:.95rem;font-weight:500;margin-top:1.75rem;transition:opacity .2s}
  .btn:hover{opacity:.88}
  .logo{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:2rem;text-decoration:none}
  .logo-text{font-size:1rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
</style>
</head>
<body>
<div class="card">
  <a href="/app/cliente/" class="logo">
    <svg width="32" height="18" viewBox="0 0 52 28" fill="none"><ellipse cx="17" cy="14" rx="13" ry="13" stroke="#7DCFCA" stroke-width="3" fill="none"/><ellipse cx="35" cy="14" rx="13" ry="13" stroke="#F2C14E" stroke-width="3" fill="none"/></svg>
    <div class="logo-text">maternal <span>mind</span></div>
  </a>
  <div class="icon">✨</div>
  <h1>¡Bienvenida a la Biblioteca Mami!</h1>
  <div class="divider"></div>
  <p>Tu suscripción se ha activado correctamente. Ya tienes acceso completo a la biblioteca de recursos en crecimiento.</p>
  <p>Gracias por estar aquí y por confiar en Maternal Mind para acompañarte en este camino.</p>
  <a href="/app/cliente/biblioteca.html" class="btn">Ir a mi Biblioteca →</a>
</div>

<script src="/app/js/auth.js"></script>
<script>
  // Refresh user plan from server
  MM.api('/api/auth-me').then(r => r?.json()).then(data => {
    if (data?.plan) {
      const user = MM.getUser();
      if (user) MM.setUser({ ...user, plan: data.plan });
    }
  }).catch(() => {});
</script>
</body>
