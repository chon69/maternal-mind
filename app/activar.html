<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activa tu cuenta · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7DCFCA;--turq-dark:#5BBFB9;--turq-deep:#4AADA7;--turq-light:#C8EDEB;--turq-vlight:#EEF9F8;--gold:#F2C14E;--ink:#3A3A3A;--ink-soft:#5E5E5E;--cream:#FDFAF5;--red:#D95555;--green:#3A9A3A}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
  header{padding:1.25rem 8vw;display:flex;align-items:center;border-bottom:1px solid rgba(125,207,202,.18)}
  .logo{display:flex;align-items:center;gap:.6rem;text-decoration:none}
  .logo-text{font-size:1rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1rem}
  .card{background:#fff;border-radius:20px;box-shadow:0 8px 40px rgba(125,207,202,.18),0 2px 12px rgba(0,0,0,.06);width:100%;max-width:440px;overflow:hidden}
  .card-accent{height:5px;background:linear-gradient(90deg,var(--turq),var(--turq-dark))}
  .card-body{padding:36px 32px}
  .step-icon{font-size:2.5rem;margin-bottom:1rem}
  h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-style:italic;font-weight:300;margin-bottom:.5rem}
  .sub{font-size:.9rem;color:var(--ink-soft);font-weight:300;line-height:1.6;margin-bottom:1.75rem}
  label{display:block;font-size:.75rem;font-weight:500;color:var(--turq-deep);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.35rem;margin-top:.9rem}
  input[type=password]{width:100%;padding:13px 15px;border:1.5px solid var(--turq-light);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.95rem;color:var(--ink);background:var(--cream);outline:none;transition:border-color .2s,box-shadow .2s}
  input:focus{border-color:var(--turq);background:#fff;box-shadow:0 0 0 3px rgba(125,207,202,.15)}
  .strength{display:flex;gap:4px;margin-top:.5rem}
  .strength-bar{height:4px;flex:1;border-radius:2px;background:var(--turq-light);transition:background .3s}
  .btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--turq),var(--turq-dark));color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:500;cursor:pointer;margin-top:1.25rem;transition:transform .2s,box-shadow .2s}
  .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(125,207,202,.4)}
  .btn:disabled{opacity:.65;cursor:not-allowed}
  .msg{font-size:.85rem;padding:.7rem 1rem;border-radius:8px;margin-top:1rem}
  .msg.error{background:#FEF2F2;border:1px solid #FCA5A5;color:var(--red)}
  .msg.success{background:#F0FFF4;border:1px solid #86EFAC;color:var(--green)}
  .invalid-block{text-align:center;padding:2rem 1rem}
  .invalid-block p{color:var(--ink-soft);margin-bottom:1rem}
  .invalid-block a{color:var(--turq-dark);text-decoration:none;font-weight:500}
</style>
</head>
<body>
<header>
  <a href="/" class="logo">
    <svg width="32" height="18" viewBox="0 0 52 28" fill="none"><ellipse cx="17" cy="14" rx="13" ry="13" stroke="#7DCFCA" stroke-width="3" fill="none"/><ellipse cx="35" cy="14" rx="13" ry="13" stroke="#F2C14E" stroke-width="3" fill="none"/></svg>
    <div class="logo-text">maternal <span>mind</span></div>
  </a>
</header>
<main>
  <div class="card">
    <div class="card-accent"></div>
    <div class="card-body" id="card-content">
      <div class="step-icon">🌿</div>
      <h1>Elige tu contraseña</h1>
      <p class="sub">Un último paso y entras directamente a tu Kit de Bienvenida y a todo tu espacio.</p>
      <form id="activate-form" novalidate>
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
        <div class="strength" id="strength">
          <div class="strength-bar" id="s1"></div>
          <div class="strength-bar" id="s2"></div>
          <div class="strength-bar" id="s3"></div>
          <div class="strength-bar" id="s4"></div>
        </div>
        <label for="confirm">Confirmar contraseña</label>
        <input type="password" id="confirm" placeholder="Repite tu contraseña" required>
        <div id="msg" class="msg" hidden></div>
        <button type="submit" class="btn" id="btn">
          <span id="btn-text">Acceder a mi Kit de Bienvenida →</span>
          <span id="btn-loading" hidden>Entrando…</span>
        </button>
      </form>
    </div>
  </div>
</main>
<script src="/app/js/auth.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token  = params.get('token');
  const email  = params.get('email');

  if (!token || !email) {
    document.getElementById('card-content').innerHTML = `
      <div class="invalid-block">
        <div style="font-size:2.5rem;margin-bottom:1rem">⚠️</div>
        <p>Este enlace no es válido o ha expirado.</p>
        <a href="/">Volver al inicio y registrarte de nuevo</a>
      </div>`;
  }

  // Password strength
  document.getElementById('password').addEventListener('input', e => {
    const v = e.target.value;
    const score = [v.length >= 8, /[A-Z]/.test(v), /[0-9]/.test(v), v.length >= 12].filter(Boolean).length;
    const colors = ['#E05252','#F59E0B','#7DCFCA','#3A9A3A'];
    ['s1','s2','s3','s4'].forEach((id, i) => {
      document.getElementById(id).style.background = i < score ? colors[score - 1] : 'var(--turq-light)';
    });
  });

  document.getElementById('activate-form').addEventListener('submit', async e => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    const msgEl    = document.getElementById('msg');
    const btn      = document.getElementById('btn');
    const btnText  = document.getElementById('btn-text');
    const btnLoad  = document.getElementById('btn-loading');

    msgEl.hidden = true;

    if (password.length < 8) {
      msgEl.className = 'msg error'; msgEl.textContent = 'La contraseña debe tener al menos 8 caracteres.'; msgEl.hidden = false; return;
    }
    if (password !== confirm) {
      msgEl.className = 'msg error'; msgEl.textContent = 'Las contraseñas no coinciden.'; msgEl.hidden = false; return;
    }

    btn.disabled = true; btnText.hidden = true; btnLoad.hidden = false;

    try {
      const res  = await fetch('/api/auth-set-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Error al activar');
      MM.setToken(data.token);
      MM.setUser(data.user);
      msgEl.className = 'msg success';
      msgEl.textContent = '¡Todo listo! Entrando a tu Kit de Bienvenida…';
      msgEl.hidden = false;
      setTimeout(() => {
        window.location.href = data.user.role === 'admin' ? '/app/admin/' : '/app/cliente/biblioteca.html';
      }, 1200);
    } catch (err) {
      msgEl.className = 'msg error'; msgEl.textContent = err.message; msgEl.hidden = false;
      btn.disabled = false; btnText.hidden = false; btnLoad.hidden = true;
    }
  });
</script>
</body>
</html>
