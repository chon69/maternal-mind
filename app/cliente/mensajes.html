<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajes · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7DCFCA;--turq-dark:#5BBFB9;--turq-deep:#4AADA7;--turq-light:#C8EDEB;--turq-vlight:#EEF9F8;--gold:#F2C14E;--gold-light:#FEF7E0;--ink:#3A3A3A;--ink-soft:#5E5E5E;--cream:#FDFAF5;--green:#166534}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
  nav{background:#fff;border-bottom:1px solid rgba(125,207,202,.18);padding:.9rem 5vw;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
  .nav-logo{display:flex;align-items:center;gap:.5rem;text-decoration:none}
  .logo-text{font-size:.95rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
  .nav-links{display:flex;align-items:center;gap:1.5rem}
  .nav-links a{font-size:.85rem;color:var(--ink-soft);text-decoration:none;transition:color .2s}
  .nav-links a:hover,.nav-links a.active{color:var(--turq-dark)}
  .nav-user{display:flex;align-items:center;gap:.75rem}
  .nav-greeting{font-size:.82rem;color:var(--ink-soft)}
  .btn-logout{font-size:.8rem;color:var(--turq-deep);background:none;border:1px solid var(--turq-light);border-radius:20px;padding:.35rem .85rem;cursor:pointer;transition:background .2s}
  .btn-logout:hover{background:var(--turq-vlight)}
  .hero-banner{background:linear-gradient(135deg,var(--turq-vlight),var(--gold-light));padding:3rem 5vw;border-bottom:1px solid rgba(125,207,202,.15)}
  .hero-inner{max-width:680px;margin:0 auto}
  .hero-banner h1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,3vw,2.5rem);font-weight:300;font-style:italic;margin-bottom:.5rem}
  .hero-banner p{font-size:.95rem;color:var(--ink-soft);font-weight:300}
  .content{max-width:680px;margin:0 auto;padding:2rem 5vw}
  /* COMPOSE */
  .compose-card{background:#fff;border:1px solid rgba(125,207,202,.2);border-radius:14px;padding:1.25rem;margin-bottom:2rem}
  .compose-card h2{font-size:.95rem;font-weight:500;color:var(--ink);margin-bottom:1rem}
  label{display:block;font-size:.72rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.3rem;margin-top:.75rem}
  label:first-of-type{margin-top:0}
  input[type=text],textarea{width:100%;padding:.65rem .85rem;border:1.5px solid var(--turq-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--ink);background:#FDFAF5;outline:none;transition:border-color .2s}
  input[type=text]:focus,textarea:focus{border-color:var(--turq);background:#fff}
  textarea{resize:vertical;min-height:110px}
  .btn-send{margin-top:1rem;padding:.6rem 1.4rem;background:var(--turq);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;transition:opacity .2s}
  .btn-send:hover{opacity:.88}
  .btn-send:disabled{opacity:.6;cursor:not-allowed}
  /* MESSAGES LIST */
  .section-title{font-size:.8rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:1rem}
  .msg-list{display:flex;flex-direction:column;gap:.9rem}
  .msg-card{background:#fff;border:1px solid rgba(125,207,202,.18);border-radius:12px;overflow:hidden}
  .msg-header{padding:.9rem 1.1rem;display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;cursor:pointer;user-select:none}
  .msg-header:hover{background:#FAFBFC}
  .msg-subject{font-size:.88rem;font-weight:500;color:var(--ink)}
  .msg-date{font-size:.72rem;color:var(--ink-soft);white-space:nowrap}
  .msg-estado{font-size:.68rem;font-weight:500;padding:.2rem .55rem;border-radius:50px;white-space:nowrap}
  .msg-estado.pendiente{background:#FEF3C7;color:#92400E}
  .msg-estado.respondido{background:#DCFCE7;color:var(--green)}
  .msg-body{padding:0 1.1rem;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s}
  .msg-body.open{padding:.75rem 1.1rem 1rem;max-height:600px}
  .msg-text{font-size:.86rem;line-height:1.65;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .msg-reply{margin-top:.85rem;padding:.85rem;background:var(--turq-vlight);border-left:3px solid var(--turq);border-radius:0 8px 8px 0}
  .msg-reply-label{font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--turq-deep);margin-bottom:.35rem}
  .msg-reply-text{font-size:.86rem;line-height:1.65;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .loading{text-align:center;padding:3rem;color:var(--ink-soft)}.spinner{width:32px;height:32px;border:2.5px solid var(--turq-light);border-top-color:var(--turq);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .75rem}@keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:2rem;color:var(--ink-soft);font-size:.88rem}
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--ink);color:#fff;padding:.75rem 1.25rem;border-radius:10px;font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
  .nav-hamburger{display:none;background:none;border:none;cursor:pointer;padding:.4rem;flex-direction:column;justify-content:center;gap:5px}
  .nav-hamburger span{display:block;width:22px;height:2px;background:var(--turq-dark);border-radius:2px}
  @media(max-width:600px){
    .nav-hamburger{display:flex}
    .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;border-bottom:1px solid rgba(125,207,202,.18);box-shadow:0 8px 20px rgba(0,0,0,.06);padding:.5rem 5vw .75rem;gap:0;z-index:49}
    .nav-links.open{display:flex}
    .nav-links a{padding:.65rem 0;border-bottom:1px solid rgba(125,207,202,.07);font-size:.9rem}
    .nav-links a:last-child{border-bottom:none}
    .nav-greeting{display:none}
  }
</style>
</head>
<body>
<nav>
  <a href="/app/cliente/" class="nav-logo">
    <svg width="28" height="16" viewBox="0 0 52 28" fill="none"><ellipse cx="17" cy="14" rx="13" ry="13" stroke="#7DCFCA" stroke-width="3" fill="none"/><ellipse cx="35" cy="14" rx="13" ry="13" stroke="#F2C14E" stroke-width="3" fill="none"/></svg>
    <div class="logo-text">maternal <span>mind</span></div>
  </a>
  <div class="nav-links">
    <a href="/app/cliente/">Inicio</a>
    <a href="/app/cliente/biblioteca.html" style="color:#B8820A;font-weight:500">✨ Biblioteca</a>
    <a href="/app/cliente/eventos.html">Eventos</a>
    <a href="/app/cliente/blog.html">Blog</a>
    <a href="/app/cliente/podcast.html">Podcast</a>
    <a href="/app/cliente/comunidad.html">Comunidad</a>
    <a href="/app/cliente/mensajes.html" class="active">Mensajes</a>
    <a href="/app/cliente/perfil.html">Mi perfil</a>
  </div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menú"><span></span><span></span><span></span></button>
  <div class="nav-user">
    <span class="nav-greeting" id="greeting"></span>
    <button class="btn-logout" onclick="MM.logout()">Cerrar sesión</button>
  </div>
</nav>

<div class="hero-banner">
  <div class="hero-inner">
    <h1>Mensajes</h1>
    <p>Escríbeme si tienes alguna duda. Te responderé lo antes posible.</p>
  </div>
</div>

<div class="content">
  <div class="compose-card">
    <h2>Escríbeme</h2>
    <label>Asunto</label>
    <input type="text" id="f-asunto" placeholder="Ej: Pregunta sobre el taller de marzo" maxlength="120">
    <label>Mensaje</label>
    <textarea id="f-contenido" placeholder="Cuéntame lo que necesitas…" maxlength="2000"></textarea>
    <button class="btn-send" id="send-btn" onclick="sendMessage()">Enviar mensaje</button>
  </div>

  <div class="section-title">Mis mensajes anteriores</div>
  <div id="msg-list"><div class="loading"><div class="spinner"></div>Cargando…</div></div>
</div>

<div class="toast" id="toast"></div>

<script src="/app/js/auth.js"></script>
<script>
  const user = MM.requireAuth('client');
  if (user) document.getElementById('greeting').textContent = user.nombre.split(' ')[0];

  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric' });
  }

  function escHtml(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function toggleMsg(id) {
    const body = document.getElementById('mb-' + id);
    if (body) body.classList.toggle('open');
  }

  function renderList(msgs) {
    const el = document.getElementById('msg-list');
    if (!msgs.length) {
      el.innerHTML = '<div class="empty">Aún no has enviado ningún mensaje.</div>';
      return;
    }
    el.innerHTML = `<div class="msg-list">${msgs.map(m => `
      <div class="msg-card">
        <div class="msg-header" onclick="toggleMsg('${m.id}')">
          <div>
            <div class="msg-subject">${escHtml(m.asunto)}</div>
            <div style="font-size:.72rem;color:var(--ink-soft);margin-top:.2rem">${fmtDate(m.created_at)}</div>
          </div>
          <span class="msg-estado ${m.estado}">${m.estado === 'respondido' ? 'Respondido' : 'Pendiente'}</span>
        </div>
        <div class="msg-body" id="mb-${m.id}">
          <div class="msg-text">${escHtml(m.contenido)}</div>
          ${m.respuesta ? `
          <div class="msg-reply">
            <div class="msg-reply-label">Respuesta de Chon</div>
            <div class="msg-reply-text">${escHtml(m.respuesta)}</div>
          </div>` : ''}
        </div>
      </div>`).join('')}</div>`;
  }

  function toast(msg, ok=true) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.background = ok ? '#166534' : '#991B1B';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
  }

  async function sendMessage() {
    const asunto = document.getElementById('f-asunto').value.trim();
    const contenido = document.getElementById('f-contenido').value.trim();
    if (!contenido) { toast('Escribe un mensaje antes de enviar', false); return; }
    const btn = document.getElementById('send-btn');
    btn.disabled = true; btn.textContent = 'Enviando…';
    try {
      const res = await MM.api('/api/client-messages', {
        method: 'POST',
        body: JSON.stringify({ asunto, contenido }),
      });
      if (!res.ok) throw new Error((await res.json()).error);
      document.getElementById('f-asunto').value = '';
      document.getElementById('f-contenido').value = '';
      toast('Mensaje enviado. Te responderé pronto 💚');
      await load();
    } catch(e) { toast(e.message, false); }
    finally { btn.disabled = false; btn.textContent = 'Enviar mensaje'; }
  }

  async function load() {
    try {
      const res = await MM.api('/api/client-messages');
      renderList(await res.json());
    } catch {
      document.getElementById('msg-list').innerHTML = '<div class="empty">Error al cargar mensajes.</div>';
    }
  }

  load();
</script>
<script>(function(){var b=document.getElementById('nav-hamburger'),l=document.querySelector('.nav-links');if(b&&l){b.addEventListener('click',function(e){e.stopPropagation();l.classList.toggle('open')});document.addEventListener('click',function(){l.classList.remove('open')})}})();</script>
</body>
</html>
