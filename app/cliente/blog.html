<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7AACB0;--turq-dark:#5B9298;--turq-deep:#4A8A8E;--turq-light:#C2D9DB;--turq-vlight:#EDF4F5;--gold:#C4A882;--gold-dark:#A8885A;--gold-light:#F5EFE6;--ink:#3A3A3A;--ink-soft:#5E5E5E;--cream:#FDFAF5}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
  nav{background:#fff;border-bottom:1px solid rgba(122,172,176,.18);padding:.9rem 5vw;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
  .nav-logo{display:flex;align-items:center;gap:.5rem;text-decoration:none}
  .logo-text{font-size:.95rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
  .nav-links{display:flex;align-items:center;gap:1.25rem}
  .nav-links a{font-size:.83rem;color:var(--ink-soft);text-decoration:none;transition:color .2s}
  .nav-links a:hover,.nav-links a.active{color:var(--turq-dark)}
  .nav-links .premium-link{color:var(--gold-dark);font-weight:500}
  .nav-user{display:flex;align-items:center;gap:.75rem}
  .nav-greeting{font-size:.82rem;color:var(--ink-soft)}
  .btn-logout{font-size:.8rem;color:var(--turq-deep);background:none;border:1px solid var(--turq-light);border-radius:20px;padding:.35rem .85rem;cursor:pointer;transition:background .2s}
  .btn-logout:hover{background:var(--turq-vlight)}
  .hero-banner{background:linear-gradient(135deg,var(--turq-vlight),var(--gold-light));padding:3rem 5vw;border-bottom:1px solid rgba(122,172,176,.15)}
  .hero-inner{max-width:1100px;margin:0 auto}
  .hero-banner h1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,3vw,2.5rem);font-weight:300;font-style:italic;margin-bottom:.5rem}
  .hero-banner p{font-size:.95rem;color:var(--ink-soft);font-weight:300}
  .content{max-width:1100px;margin:0 auto;padding:2.5rem 5vw}
  /* FILTERS */
  .filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2rem}
  .filter-btn{padding:.38rem 1rem;border-radius:50px;border:1.5px solid var(--turq-light);background:#fff;color:var(--ink-soft);font-size:.8rem;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s}
  .filter-btn.active,.filter-btn:hover{background:var(--turq);border-color:var(--turq);color:#fff}
  /* GRID */
  .blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem}
  .blog-card{background:#fff;border:1px solid rgba(122,172,176,.18);border-radius:16px;overflow:hidden;cursor:pointer;transition:box-shadow .22s,transform .22s}
  .blog-card:hover{box-shadow:0 8px 30px rgba(122,172,176,.2);transform:translateY(-3px)}
  .blog-img{height:180px;background:linear-gradient(135deg,var(--turq-vlight),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:2.5rem;overflow:hidden}
  .blog-img img{width:100%;height:100%;object-fit:cover}
  .blog-body{padding:1.5rem}
  .blog-cat{display:inline-block;font-size:.62rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--turq-deep);background:var(--turq-vlight);border:1px solid var(--turq-light);padding:.2rem .6rem;border-radius:50px;margin-bottom:.75rem}
  .blog-card h3{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:400;color:var(--ink);margin-bottom:.5rem;line-height:1.35}
  .blog-card p{font-size:.85rem;color:var(--ink-soft);line-height:1.7;font-weight:300;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .blog-meta{margin-top:1rem;font-size:.75rem;color:var(--turq-deep)}
  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem;opacity:0;pointer-events:none;transition:opacity .25s;overflow-y:auto}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:#fff;border-radius:20px;max-width:720px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);margin:auto}
  .modal-header{padding:2rem 2.5rem 1.25rem;border-bottom:1px solid var(--turq-vlight);position:relative}
  .modal-header h2{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;font-style:italic;color:var(--ink);line-height:1.2}
  .modal-header .blog-cat{margin-bottom:.75rem}
  .modal-header .blog-meta{margin-top:.75rem}
  .modal-close{position:absolute;top:1.25rem;right:1.5rem;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--ink-soft)}
  .modal-content-wrap{padding:1.75rem 2.5rem 2.5rem}
  .article-body{font-size:.97rem;color:var(--ink);line-height:1.85;font-weight:300}
  .article-body h2,.article-body h3{font-family:'Cormorant Garamond',serif;margin:1.5rem 0 .75rem;color:var(--ink)}
  .article-body p{margin-bottom:1.1rem}
  .article-body ul,.article-body ol{padding-left:1.5rem;margin-bottom:1.1rem}
  .article-body li{margin-bottom:.4rem}
  .article-body blockquote{border-left:3px solid var(--turq);padding-left:1rem;color:var(--ink-soft);font-style:italic;margin:1.25rem 0}
  .loading{text-align:center;padding:4rem;color:var(--ink-soft)}
  .spinner{width:36px;height:36px;border:3px solid var(--turq-light);border-top-color:var(--turq);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}@keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:4rem;color:var(--ink-soft)}.empty p{font-size:.95rem;font-weight:300}
  .nav-hamburger{display:none;background:none;border:none;cursor:pointer;padding:.4rem;flex-direction:column;justify-content:center;gap:5px}
  .nav-hamburger span{display:block;width:22px;height:2px;background:var(--turq-dark);border-radius:2px}
  @media(max-width:600px){
    .nav-hamburger{display:flex}
    .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;border-bottom:1px solid rgba(122,172,176,.18);box-shadow:0 8px 20px rgba(0,0,0,.06);padding:.5rem 5vw .75rem;gap:0;z-index:49}
    .nav-links.open{display:flex}
    .nav-links a{padding:.65rem 0;border-bottom:1px solid rgba(122,172,176,.07);font-size:.9rem}
    .nav-links a:last-child{border-bottom:none}
    .nav-greeting{display:none}
    .blog-grid{grid-template-columns:1fr}.modal-header,.modal-content-wrap{padding:1.25rem}
  }
</style>
</head>
<body>
<nav>
  <a href="/app/cliente/" class="nav-logo">
    <svg width="28" height="16" viewBox="0 0 52 28" fill="none"><ellipse cx="17" cy="14" rx="13" ry="13" stroke="#7AACB0" stroke-width="3" fill="none"/><ellipse cx="35" cy="14" rx="13" ry="13" stroke="#C4A882" stroke-width="3" fill="none"/></svg>
    <div class="logo-text">maternal <span>mind</span></div>
  </a>
  <div class="nav-links">
    <a href="/app/cliente/">Inicio</a>
    <a href="/app/cliente/biblioteca.html" class="premium-link">✨ Biblioteca</a>
    <a href="/app/cliente/eventos.html">Eventos</a>
    <a href="/app/cliente/blog.html" class="active">Blog</a>
    <a href="/app/cliente/podcast.html">Podcast</a>
    <a href="/app/cliente/perfil.html">Mi perfil</a>
  </div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menú"><span></span><span></span><span></span></button>
  <div class="nav-user">
    <span class="nav-greeting" id="greeting"></span>
    <button class="btn-logout" onclick="MM.logout()">Salir</button>
  </div>
</nav>

<div class="hero-banner">
  <div class="hero-inner">
    <h1>Blog</h1>
    <p>Reflexiones, prácticas y acompañamiento sobre maternidad consciente.</p>
  </div>
</div>

<div class="content">
  <div class="filters" id="filters"></div>
  <div id="blog-container">
    <div class="loading"><div class="spinner"></div>Cargando artículos…</div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="blog-cat" id="modal-cat"></span>
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2 id="modal-title"></h2>
      <div class="blog-meta" id="modal-meta"></div>
    </div>
    <div class="modal-content-wrap">
      <div class="article-body" id="modal-body"></div>
    </div>
  </div>
</div>

<script src="/app/js/auth.js"></script>
<script>
  const user = MM.requireAuth('client');
  if (!user) throw new Error('no auth');
  document.getElementById('greeting').textContent = user.nombre.split(' ')[0];

  const CAT_EMOJI = { mindfulness:'🧘', maternidad:'🌿', bienestar:'💛', relacion:'💞', general:'✍️' };
  let allPosts = [], currentCat = 'todos';

  function formatDate(str) {
    if (!str) return '';
    return new Date(str).toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });
  }

  function buildFilters(posts) {
    const cats = [...new Set(posts.map(p => p.categoria).filter(Boolean))];
    const f = document.getElementById('filters');
    f.innerHTML = `<button class="filter-btn active" onclick="filter('todos',this)">Todos</button>` +
      cats.map(c => `<button class="filter-btn" onclick="filter('${c}',this)">${CAT_EMOJI[c]||'📂'} ${c.charAt(0).toUpperCase()+c.slice(1)}</button>`).join('');
  }

  function filter(cat, btn) {
    currentCat = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(cat === 'todos' ? allPosts : allPosts.filter(p => p.categoria === cat));
  }

  function render(posts) {
    const c = document.getElementById('blog-container');
    if (!posts.length) {
      c.innerHTML = '<div class="empty"><p>🌱 No hay artículos en esta categoría todavía.</p></div>';
      return;
    }
    c.innerHTML = `<div class="blog-grid">${posts.map(p => `
      <div class="blog-card" onclick="openPost(${JSON.stringify(p).replace(/"/g,'&quot;')})">
        <div class="blog-img">${p.imagen_url ? `<img src="${p.imagen_url}" alt="${p.titulo}" loading="lazy">` : (CAT_EMOJI[p.categoria]||'✍️')}</div>
        <div class="blog-body">
          ${p.categoria ? `<span class="blog-cat">${p.categoria}</span>` : ''}
          <h3>${p.titulo}</h3>
          <p>${p.descripcion || ''}</p>
          <div class="blog-meta">📅 ${formatDate(p.created_at)}</div>
        </div>
      </div>`).join('')}</div>`;
  }

  function openPost(p) {
    document.getElementById('modal-cat').textContent  = p.categoria || '';
    document.getElementById('modal-title').textContent = p.titulo;
    document.getElementById('modal-meta').textContent  = `📅 ${formatDate(p.created_at)}`;
    document.getElementById('modal-body').innerHTML = p.contenido_html || `<p style="color:var(--ink-soft);font-style:italic">${p.descripcion || 'Contenido próximamente.'}</p>`;
    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  async function load() {
    try {
      const res = await MM.api('/api/client-blog');
      allPosts  = await res.json();
      if (!allPosts.length) {
        document.getElementById('blog-container').innerHTML = '<div class="empty"><p>🌱 Los artículos del blog están en camino. Vuelve pronto.</p></div>';
        return;
      }
      buildFilters(allPosts);
      render(allPosts);
    } catch {
      document.getElementById('blog-container').innerHTML = '<div class="empty"><p>Error al cargar. Recarga la página.</p></div>';
    }
  }
  load();
</script>
<script>(function(){var b=document.getElementById('nav-hamburger'),l=document.querySelector('.nav-links');if(b&&l){b.addEventListener('click',function(e){e.stopPropagation();l.classList.toggle('open')});document.addEventListener('click',function(){l.classList.remove('open')})}})();</script>
</body>
</html>
