<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7AACB0;--turq-dark:#5B9298;--turq-deep:#4A8A8E;--turq-light:#C2D9DB;--turq-vlight:#EDF4F5;--gold:#C4A882;--gold-dark:#A8885A;--gold-light:#F5EFE6;--ink:#3A3A3A;--ink-soft:#5E5E5E;--cream:#FDFAF5}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
  nav{background:#fff;border-bottom:1px solid rgba(122,172,176,.18);padding:.9rem 5vw;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
  .nav-logo{display:flex;align-items:center;gap:.5rem;text-decoration:none}
  .logo-text{font-size:.95rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
  .nav-links{display:flex;align-items:center;gap:1.25rem}
  .nav-links a{font-size:.83rem;color:var(--ink-soft);text-decoration:none;transition:color .2s}
  .nav-links a:hover,.nav-links a.active{color:var(--turq-dark)}
  .nav-links .premium-link{color:var(--gold-dark);font-weight:500}
  .nav-user{display:flex;align-items:center;gap:.75rem}
  .nav-greeting{font-size:.82rem;color:var(--ink-soft)}
  .btn-logout{font-size:.8rem;color:var(--turq-deep);background:none;border:1px solid var(--turq-light);border-radius:20px;padding:.35rem .85rem;cursor:pointer;transition:background .2s}
  .btn-logout:hover{background:var(--turq-vlight)}
  .hero-banner{background:linear-gradient(135deg,var(--turq-vlight),var(--gold-light));padding:3rem 5vw;border-bottom:1px solid rgba(122,172,176,.15)}
  .hero-inner{max-width:1100px;margin:0 auto}
  .hero-banner h1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,3vw,2.5rem);font-weight:300;font-style:italic;margin-bottom:.5rem}
  .hero-banner p{font-size:.95rem;color:var(--ink-soft);font-weight:300}
  .content{max-width:1100px;margin:0 auto;padding:2.5rem 5vw}
  /* EPISODE LIST */
  .episodes{display:flex;flex-direction:column;gap:1.25rem}
  .ep-card{background:#fff;border:1px solid rgba(122,172,176,.18);border-radius:16px;padding:1.5rem;display:flex;gap:1.25rem;align-items:flex-start;transition:box-shadow .22s}
  .ep-card:hover{box-shadow:0 6px 24px rgba(122,172,176,.16)}
  .ep-cover{width:90px;height:90px;border-radius:12px;object-fit:cover;flex-shrink:0;background:linear-gradient(135deg,var(--turq-vlight),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:2rem}
  .ep-cover img{width:100%;height:100%;object-fit:cover;border-radius:12px}
  .ep-body{flex:1;min-width:0}
  .ep-num{font-size:.65rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--turq-deep);margin-bottom:.3rem}
  .ep-card h3{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400;color:var(--ink);margin-bottom:.4rem;line-height:1.3}
  .ep-desc{font-size:.85rem;color:var(--ink-soft);line-height:1.65;font-weight:300;margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ep-links{display:flex;gap:.6rem;flex-wrap:wrap}
  .ep-link{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .9rem;border-radius:50px;font-size:.78rem;font-weight:500;text-decoration:none;transition:opacity .2s;border:1.5px solid}
  .ep-link:hover{opacity:.82}
  .ep-link.spotify{background:#1DB954;color:#fff;border-color:#1DB954}
  .ep-link.apple{background:#9B59B6;color:#fff;border-color:#9B59B6}
  .ep-link.ivoox{background:#F59E0B;color:#fff;border-color:#F59E0B}
  .ep-link.default{background:var(--turq-vlight);color:var(--turq-dark);border-color:var(--turq-light)}
  .loading{text-align:center;padding:4rem;color:var(--ink-soft)}
  .spinner{width:36px;height:36px;border:3px solid var(--turq-light);border-top-color:var(--turq);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}@keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:4rem;color:var(--ink-soft)}.empty p{font-size:.95rem;font-weight:300}
  .nav-hamburger{display:none;background:none;border:none;cursor:pointer;padding:.4rem;flex-direction:column;justify-content:center;gap:5px}
  .nav-hamburger span{display:block;width:22px;height:2px;background:var(--turq-dark);border-radius:2px}
  @media(max-width:600px){
    .nav-hamburger{display:flex}
    .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;border-bottom:1px solid rgba(122,172,176,.18);box-shadow:0 8px 20px rgba(0,0,0,.06);padding:.5rem 5vw .75rem;gap:0;z-index:49}
    .nav-links.open{display:flex}
    .nav-links a{padding:.65rem 0;border-bottom:1px solid rgba(122,172,176,.07);font-size:.9rem}
    .nav-links a:last-child{border-bottom:none}
    .nav-greeting{display:none}
    .ep-card{flex-direction:column}.ep-cover{width:100%;height:160px}
  }
</style>
</head>
<body>
<nav>
  <a href="/app/cliente/" class="nav-logo">
    <svg width="28" height="16" viewBox="0 0 52 28" fill="none"><ellipse cx="17" cy="14" rx="13" ry="13" stroke="#7AACB0" stroke-width="3" fill="none"/><ellipse cx="35" cy="14" rx="13" ry="13" stroke="#C4A882" stroke-width="3" fill="none"/></svg>
    <div class="logo-text">maternal <span>mind</span></div>
  </a>
  <div class="nav-links">
    <a href="/app/cliente/">Inicio</a>
    <a href="/app/cliente/biblioteca.html" class="premium-link">✨ Biblioteca</a>
    <a href="/app/cliente/eventos.html">Eventos</a>
    <a href="/app/cliente/blog.html">Blog</a>
    <a href="/app/cliente/podcast.html" class="active">Podcast</a>
    <a href="/app/cliente/perfil.html">Mi perfil</a>
  </div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menú"><span></span><span></span><span></span></button>
  <div class="nav-user">
    <span class="nav-greeting" id="greeting"></span>
    <button class="btn-logout" onclick="MM.logout()">Salir</button>
  </div>
</nav>

<div class="hero-banner">
  <div class="hero-inner">
    <h1>Podcast</h1>
    <p>Conversaciones reales sobre maternidad, mindfulness y bienestar. Escúchalo donde prefieras.</p>
  </div>
</div>

<div class="content">

  <!-- Spotify show embed -->
  <div style="background:#fff;border-radius:16px;border:1px solid rgba(122,172,176,.18);padding:1.5rem;margin-bottom:2rem">
    <p style="font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--turq-deep);margin-bottom:.75rem">🎙️ Escucha el podcast en Spotify</p>
    <iframe style="border-radius:10px" src="https://open.spotify.com/embed/show/0KlrDaWUAxp3bYQcc6ybdN?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>

  <div id="podcast-container">
    <div class="loading"><div class="spinner"></div>Cargando episodios…</div>
  </div>
</div>

<script src="/app/js/auth.js"></script>
<script>
  const user = MM.requireAuth('client');
  if (!user) throw new Error('no auth');
  document.getElementById('greeting').textContent = user.nombre.split(' ')[0];

  async function load() {
    const c = document.getElementById('podcast-container');
    try {
      const res      = await MM.api('/api/client-podcast');
      const episodes = await res.json();
      if (!episodes.length) {
        c.innerHTML = '<div class="empty"><p>🎙️ Pronto estarán aquí los episodios del podcast. ¡Vuelve pronto!</p></div>';
        return;
      }
      c.innerHTML = `<div class="episodes">${episodes.map(ep => {
        const cover = ep.imagen_url
          ? `<div class="ep-cover"><img src="${ep.imagen_url}" alt="${ep.titulo}" loading="lazy"></div>`
          : `<div class="ep-cover">🎙️</div>`;
        const num = [ep.temporada && `T${ep.temporada}`, ep.numero_episodio && `Ep. ${ep.numero_episodio}`].filter(Boolean).join(' · ');
        // Extract Spotify episode ID for embedded player
        const epMatch = ep.url_spotify ? ep.url_spotify.match(/episode\/([A-Za-z0-9]+)/) : null;
        const spotifyEmbed = epMatch
          ? `<iframe style="border-radius:8px;margin-top:.75rem;display:block" src="https://open.spotify.com/embed/episode/${epMatch[1]}?utm_source=generator" width="100%" height="80" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`
          : '';
        const links = [
          ep.url_apple && `<a href="${ep.url_apple}" target="_blank" rel="noopener" class="ep-link apple">▶ Apple</a>`,
          ep.url_ivoox && `<a href="${ep.url_ivoox}" target="_blank" rel="noopener" class="ep-link ivoox">▶ iVoox</a>`,
        ].filter(Boolean).join('');
        return `
          <div class="ep-card">
            ${cover}
            <div class="ep-body">
              ${num ? `<div class="ep-num">${num}</div>` : ''}
              <h3>${ep.titulo}</h3>
              ${ep.descripcion ? `<p class="ep-desc">${ep.descripcion}</p>` : ''}
              ${spotifyEmbed}
              ${links ? `<div class="ep-links" style="margin-top:.6rem">${links}</div>` : ''}
            </div>
          </div>`;
      }).join('')}</div>`;
    } catch {
      c.innerHTML = '<div class="empty"><p>Error al cargar. Recarga la página.</p></div>';
    }
  }
  load();
</script>
<script>(function(){var b=document.getElementById('nav-hamburger'),l=document.querySelector('.nav-links');if(b&&l){b.addEventListener('click',function(e){e.stopPropagation();l.classList.toggle('open')});document.addEventListener('click',function(){l.classList.remove('open')})}})();</script>
</body>
</html>
