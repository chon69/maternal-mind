<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7DCFCA;--turq-dark:#5BBFB9;--turq-deep:#4AADA7;--turq-light:#C8EDEB;--turq-vlight:#EEF9F8;--gold:#F2C14E;--gold-light:#FEF7E0;--ink:#3A3A3A;--ink-soft:#5E5E5E;--cream:#FDFAF5}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
  nav{background:#fff;border-bottom:1px solid rgba(125,207,202,.18);padding:.9rem 5vw;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
  .nav-logo{display:flex;align-items:center;gap:.5rem;text-decoration:none}
  .logo-text{font-size:.95rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
  .nav-links{display:flex;align-items:center;gap:1.5rem}
  .nav-links a{font-size:.85rem;color:var(--ink-soft);text-decoration:none;transition:color .2s}
  .nav-links a:hover,.nav-links a.active{color:var(--turq-dark)}
  .nav-user{display:flex;align-items:center;gap:.75rem}
  .nav-greeting{font-size:.82rem;color:var(--ink-soft)}
  .btn-logout{font-size:.8rem;color:var(--turq-deep);background:none;border:1px solid var(--turq-light);border-radius:20px;padding:.35rem .85rem;cursor:pointer;transition:background .2s}
  .btn-logout:hover{background:var(--turq-vlight)}
  .hero-banner{background:linear-gradient(135deg,var(--turq-vlight),var(--gold-light));padding:3rem 5vw;border-bottom:1px solid rgba(125,207,202,.15)}
  .hero-inner{max-width:1100px;margin:0 auto}
  .hero-banner h1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,3vw,2.5rem);font-weight:300;font-style:italic;margin-bottom:.5rem}
  .hero-banner p{font-size:.95rem;color:var(--ink-soft);font-weight:300}
  .content{max-width:1100px;margin:0 auto;padding:2.5rem 5vw}
  /* FILTERS */
  .filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2rem}
  .filter-btn{padding:.4rem 1rem;border-radius:50px;border:1.5px solid var(--turq-light);background:#fff;color:var(--ink-soft);font-size:.8rem;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s}
  .filter-btn.active,.filter-btn:hover{background:var(--turq);border-color:var(--turq);color:#fff}
  /* EVENTS GRID */
  .events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.25rem}
  .event-card{background:#fff;border:1px solid rgba(125,207,202,.18);border-radius:16px;overflow:hidden;transition:box-shadow .2s,transform .2s}
  .event-card:hover{box-shadow:0 6px 28px rgba(125,207,202,.22);transform:translateY(-2px)}
  .event-img{height:160px;background:linear-gradient(135deg,var(--turq-vlight),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:3rem}
  .event-img img{width:100%;height:100%;object-fit:cover}
  .event-body{padding:1.25rem}
  .event-type{display:inline-block;font-size:.62rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--turq-deep);background:var(--turq-vlight);border:1px solid var(--turq-light);padding:.2rem .6rem;border-radius:50px;margin-bottom:.65rem}
  .event-card h3{font-family:'DM Sans',sans-serif;font-size:.98rem;font-weight:500;color:var(--ink);margin-bottom:.4rem}
  .event-desc{font-size:.82rem;color:var(--ink-soft);line-height:1.65;font-weight:300;margin-bottom:.5rem}
  .event-desc.clamped{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .btn-expand{background:none;border:none;font-size:.75rem;color:var(--turq-dark);cursor:pointer;padding:0;margin-bottom:.75rem;font-family:'DM Sans',sans-serif;text-decoration:underline}
  .event-meta{display:flex;flex-wrap:wrap;gap:.5rem .9rem;font-size:.75rem;color:var(--turq-deep);margin-bottom:1rem}
  .event-badge-dest{position:absolute;top:.75rem;right:.75rem;background:var(--gold);color:#fff;font-size:.62rem;font-weight:500;padding:.2rem .6rem;border-radius:50px}
  .event-cta{display:block;text-align:center;background:var(--turq);color:#fff;text-decoration:none;padding:.7rem 1rem;border-radius:8px;font-size:.85rem;font-weight:500;transition:opacity .2s}
  .event-cta:hover{opacity:.88}
  .event-cta.gratis{background:var(--gold)}
  .loading{text-align:center;padding:4rem;color:var(--ink-soft)}.spinner{width:36px;height:36px;border:3px solid var(--turq-light);border-top-color:var(--turq);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}@keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:4rem;color:var(--ink-soft)}.empty p{font-size:.95rem;font-weight:300}
  .nav-hamburger{display:none;background:none;border:none;cursor:pointer;padding:.4rem;flex-direction:column;justify-content:center;gap:5px}
  .nav-hamburger span{display:block;width:22px;height:2px;background:var(--turq-dark);border-radius:2px}
  @media(max-width:600px){
    .nav-hamburger{display:flex}
    .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;border-bottom:1px solid rgba(125,207,202,.18);box-shadow:0 8px 20px rgba(0,0,0,.06);padding:.5rem 5vw .75rem;gap:0;z-index:49}
    .nav-links.open{display:flex}
    .nav-links a{padding:.65rem 0;border-bottom:1px solid rgba(125,207,202,.07);font-size:.9rem}
    .nav-links a:last-child{border-bottom:none}
    .nav-greeting{display:none}
    .events-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<nav>
  <a href="/app/cliente/" class="nav-logo">
    <svg width="28" height="16" viewBox="0 0 52 28" fill="none"><ellipse cx="17" cy="14" rx="13" ry="13" stroke="#7DCFCA" stroke-width="3" fill="none"/><ellipse cx="35" cy="14" rx="13" ry="13" stroke="#F2C14E" stroke-width="3" fill="none"/></svg>
    <div class="logo-text">maternal <span>mind</span></div>
  </a>
  <div class="nav-links">
    <a href="/app/cliente/">Inicio</a>
    <a href="/app/cliente/biblioteca.html" style="color:#B8820A;font-weight:500">✨ Biblioteca</a>
    <a href="/app/cliente/eventos.html" class="active">Eventos</a>
    <a href="/app/cliente/blog.html">Blog</a>
    <a href="/app/cliente/podcast.html">Podcast</a>
    <a href="/app/cliente/comunidad.html">Comunidad</a>
    <a href="/app/cliente/mensajes.html">Mensajes</a>
    <a href="/app/cliente/perfil.html">Mi perfil</a>
  </div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menú"><span></span><span></span><span></span></button>
  <div class="nav-user">
    <span class="nav-greeting" id="greeting"></span>
    <button class="btn-logout" onclick="MM.logout()">Cerrar sesión</button>
  </div>
</nav>

<div class="hero-banner">
  <div class="hero-inner">
    <h1>Próximos eventos</h1>
    <p>Círculos, talleres, programas, retos y retiros para acompañarte en tu maternidad.</p>
  </div>
</div>

<div class="content">
  <div class="filters" id="filters">
    <button class="filter-btn active" data-tipo="todos" onclick="filterEvents('todos',this)">Todos</button>
    <button class="filter-btn" data-tipo="circulo" onclick="filterEvents('circulo',this)">🌙 Círculos</button>
    <button class="filter-btn" data-tipo="taller" onclick="filterEvents('taller',this)">🌸 Talleres</button>
    <button class="filter-btn" data-tipo="programa" onclick="filterEvents('programa',this)">🌱 Programas</button>
    <button class="filter-btn" data-tipo="reto" onclick="filterEvents('reto',this)">💫 Retos</button>
    <button class="filter-btn" data-tipo="retiro" onclick="filterEvents('retiro',this)">🏔️ Retiros</button>
  </div>
  <div id="events-container">
    <div class="loading"><div class="spinner"></div>Cargando eventos…</div>
  </div>
</div>

<script src="/app/js/auth.js"></script>
<script>
  const user = MM.requireAuth('client');
  if (user) document.getElementById('greeting').textContent = user.nombre.split(' ')[0];

  const TYPE_EMOJI = { circulo:'🌙', taller:'🌸', programa:'🌱', reto:'💫', retiro:'🏔️' };
  let allEvents = [];

  function formatDate(str) {
    if (!str) return '';
    const d = new Date(str);
    return d.toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });
  }

  function renderEvents(events) {
    const container = document.getElementById('events-container');
    if (!events.length) {
      container.innerHTML = '<div class="empty"><p>🌱 No hay eventos de este tipo por el momento. ¡Vuelve pronto!</p></div>';
      return;
    }
    container.innerHTML = `<div class="events-grid">${events.map(e => `
      <div class="event-card" style="position:relative">
        ${e.destacado === 'TRUE' ? '<span class="event-badge-dest">✨ Destacado</span>' : ''}
        <div class="event-img">${e.imagen_url ? `<img src="${e.imagen_url}" alt="${e.titulo}" loading="lazy" style="object-position:${e.imagen_posicion||'50% 50%'}">` : TYPE_EMOJI[e.tipo]||'🌿'}</div>
        <div class="event-body">
          <span class="event-type">${e.tipo}</span>
          <h3>${e.titulo}</h3>
          <p class="event-desc clamped" id="desc-${e.id}">${e.descripcion}</p>
          ${e.descripcion && e.descripcion.length > 120 ? `<button class="btn-expand" onclick="toggleDesc('${e.id}',this)">Leer más</button>` : ''}
          <div class="event-meta">
            ${e.fecha_inicio ? `📅 ${formatDate(e.fecha_inicio)}` : ''}
            ${(e.hora_inicio||e.hora_fin) ? `🕐 ${e.hora_inicio||''}${e.hora_fin ? ` – ${e.hora_fin}` : ''}` : ''}
            ${e.precio && e.precio !== '0' ? `💶 ${e.precio} ${e.moneda||'EUR'}` : '<span style="color:var(--gold)">💛 Gratuito</span>'}
          </div>
          ${e.url_inscripcion
            ? `<a href="${e.url_inscripcion}" target="_blank" class="event-cta ${e.precio==='0'?'gratis':''}">Inscribirme →</a>`
            : '<span style="font-size:.8rem;color:var(--ink-soft)">Próximamente</span>'}
        </div>
      </div>`).join('')}</div>`;
  }

  function toggleDesc(id, btn) {
    const p = document.getElementById('desc-' + id);
    const expanded = !p.classList.contains('clamped');
    p.classList.toggle('clamped', expanded);
    btn.textContent = expanded ? 'Leer más' : 'Leer menos';
  }

  function filterEvents(tipo, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderEvents(tipo === 'todos' ? allEvents : allEvents.filter(e => e.tipo === tipo));
  }

  async function load() {
    try {
      const res  = await MM.api('/api/client-events');
      const raw  = await res.json();
      const cutoff = new Date(Date.now() - 3 * 86400000); cutoff.setHours(0,0,0,0);
      allEvents  = raw.filter(e => new Date(e.fecha_fin || e.fecha_inicio) >= cutoff);
      renderEvents(allEvents);
    } catch {
      document.getElementById('events-container').innerHTML =
        '<div class="empty"><p>Error al cargar eventos. Intenta recargar.</p></div>';
    }
  }
  load();
</script>
<script>(function(){var b=document.getElementById('nav-hamburger'),l=document.querySelector('.nav-links');if(b&&l){b.addEventListener('click',function(e){e.stopPropagation();l.classList.toggle('open')});document.addEventListener('click',function(){l.classList.remove('open')})}})();</script>
</body>
</html>
