<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7DCFCA;--turq-dark:#5BBFB9;--turq-deep:#4AADA7;--turq-light:#C8EDEB;--turq-vlight:#EEF9F8;--gold:#F2C14E;--gold-dark:#B8820A;--gold-light:#FEF7E0;--ink:#3A3A3A;--ink-soft:#5E5E5E;--cream:#FDFAF5;--red:#D95555;--green:#3A9A3A}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
  nav{background:#fff;border-bottom:1px solid rgba(125,207,202,.18);padding:.9rem 5vw;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
  .nav-logo{display:flex;align-items:center;gap:.5rem;text-decoration:none}
  .logo-text{font-size:.95rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
  .nav-links{display:flex;align-items:center;gap:1.25rem}
  .nav-links a{font-size:.83rem;color:var(--ink-soft);text-decoration:none;transition:color .2s}
  .nav-links a:hover,.nav-links a.active{color:var(--turq-dark)}
  .nav-links .premium-link{color:var(--gold-dark);font-weight:500}
  .nav-user{display:flex;gap:.75rem;align-items:center}
  .btn-logout{font-size:.8rem;color:var(--turq-deep);background:none;border:1px solid var(--turq-light);border-radius:20px;padding:.35rem .85rem;cursor:pointer;transition:background .2s}
  .btn-logout:hover{background:var(--turq-vlight)}
  .nav-hamburger{display:none;background:none;border:none;cursor:pointer;padding:.4rem;flex-direction:column;justify-content:center;gap:5px}
  .nav-hamburger span{display:block;width:22px;height:2px;background:var(--turq-dark);border-radius:2px}
  @media(max-width:600px){
    .nav-hamburger{display:flex}
    .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;border-bottom:1px solid rgba(125,207,202,.18);box-shadow:0 8px 20px rgba(0,0,0,.06);padding:.5rem 5vw .75rem;gap:0;z-index:49}
    .nav-links.open{display:flex}
    .nav-links a{padding:.65rem 0;border-bottom:1px solid rgba(125,207,202,.07);font-size:.9rem}
    .nav-links a:last-child{border-bottom:none}
  }
  .content{max-width:640px;margin:3rem auto;padding:0 5vw}
  h1{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-style:italic;font-weight:300;margin-bottom:2rem}
  .card{background:#fff;border:1px solid rgba(125,207,202,.18);border-radius:16px;padding:1.75rem;margin-bottom:1.5rem}
  .card h2{font-size:.82rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--turq-deep);margin-bottom:1.25rem}
  .field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.9rem}
  .field label{font-size:.72rem;font-weight:500;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
  .field-value{font-size:.95rem;color:var(--ink);padding:.65rem 0;border-bottom:1px solid var(--turq-vlight)}
  input[type=password]{width:100%;padding:12px 14px;border:1.5px solid var(--turq-light);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--ink);background:var(--cream);outline:none;transition:border-color .2s}
  input:focus{border-color:var(--turq);background:#fff;box-shadow:0 0 0 3px rgba(125,207,202,.15)}
  .btn{padding:11px 24px;background:linear-gradient(135deg,var(--turq),var(--turq-dark));color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;transition:transform .2s,box-shadow .2s;margin-top:.75rem}
  .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(125,207,202,.35)}
  .btn:disabled{opacity:.65;cursor:not-allowed}
  .msg{font-size:.83rem;padding:.65rem 1rem;border-radius:8px;margin-top:.75rem}
  .msg.error{background:#FEF2F2;border:1px solid #FCA5A5;color:var(--red)}
  .msg.success{background:#F0FFF4;border:1px solid #86EFAC;color:var(--green)}
  /* PLAN */
  .plan-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
  .plan-info{flex:1}
  .plan-label{font-size:.72rem;font-weight:500;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.35rem}
  .plan-name{font-size:1.05rem;font-weight:500;color:var(--ink)}
  .plan-desc{font-size:.82rem;color:var(--ink-soft);line-height:1.55;margin-top:.2rem}
  .badge-plan{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .85rem;border-radius:50px;font-size:.75rem;font-weight:500}
  .badge-plan.free{background:var(--turq-vlight);color:var(--turq-dark);border:1.5px solid var(--turq-light)}
  .badge-plan.premium{background:linear-gradient(135deg,var(--gold),#F5DFA0);color:#fff}
  .btn-upgrade{padding:10px 20px;background:linear-gradient(135deg,var(--gold) 0%,#F5DFA0 100%);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;transition:opacity .2s;white-space:nowrap}
  .btn-upgrade:hover{opacity:.88}
  .btn-upgrade:disabled{opacity:.6;cursor:not-allowed}
</style>
</head>
<body>
<nav>
  <a href="/app/cliente/" class="nav-logo">
    <svg width="28" height="16" viewBox="0 0 52 28" fill="none"><ellipse cx="17" cy="14" rx="13" ry="13" stroke="#7DCFCA" stroke-width="3" fill="none"/><ellipse cx="35" cy="14" rx="13" ry="13" stroke="#F2C14E" stroke-width="3" fill="none"/></svg>
    <div class="logo-text">maternal <span>mind</span></div>
  </a>
  <div class="nav-links">
    <a href="/app/cliente/">Inicio</a>
    <a href="/app/cliente/biblioteca.html" class="premium-link">✨ Biblioteca</a>
    <a href="/app/cliente/eventos.html">Eventos</a>
    <a href="/app/cliente/blog.html">Blog</a>
    <a href="/app/cliente/podcast.html">Podcast</a>
    <a href="/app/cliente/perfil.html" class="active">Mi perfil</a>
  </div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menú"><span></span><span></span><span></span></button>
  <div class="nav-user">
    <button class="btn-logout" onclick="MM.logout()">Salir</button>
  </div>
</nav>

<div class="content">
  <h1>Mi perfil</h1>

  <div class="card">
    <h2>Mis datos</h2>
    <div class="field">
      <label>Nombre</label>
      <div class="field-value" id="f-nombre"></div>
    </div>
    <div class="field">
      <label>Email</label>
      <div class="field-value" id="f-email"></div>
    </div>
    <div class="field">
      <label>Miembro desde</label>
      <div class="field-value" id="f-since"></div>
    </div>
  </div>

  <div class="card">
    <h2>Mi suscripción</h2>
    <div class="plan-row">
      <div class="plan-info">
        <div class="plan-label">Plan activo</div>
        <div id="plan-display"></div>
      </div>
      <button class="btn-upgrade" id="btn-upgrade" onclick="startCheckout()" style="display:none">Suscribirme →</button>
    </div>
  </div>

  <div class="card">
    <h2>Cambiar contraseña</h2>
    <form id="pwd-form" novalidate>
      <div class="field" style="margin-bottom:.5rem">
        <label>Nueva contraseña</label>
        <input type="password" id="newpwd" placeholder="Mínimo 8 caracteres" required>
      </div>
      <div class="field">
        <label>Confirmar contraseña</label>
        <input type="password" id="confirmpwd" placeholder="Repite la contraseña" required>
      </div>
      <div id="pwd-msg" class="msg" hidden></div>
      <button type="submit" class="btn" id="pwd-btn">Guardar nueva contraseña</button>
    </form>
  </div>
</div>

<script src="/app/js/auth.js"></script>
<script>
  let user = MM.requireAuth('client');
  if (!user) throw new Error('no auth');

  document.getElementById('f-nombre').textContent = user.nombre;
  document.getElementById('f-email').textContent  = user.email;

  function renderPlan(plan) {
    const isPremium = plan === 'biblioteca_mami';
    const display   = document.getElementById('plan-display');
    if (isPremium) {
      display.innerHTML = `<span class="badge-plan premium">✨ Biblioteca Mami</span><p class="plan-desc" style="margin-top:.5rem">Tienes acceso completo a la biblioteca de recursos en crecimiento.</p>`;
    } else {
      display.innerHTML = `<span class="badge-plan free">Plan gratuito</span><p class="plan-desc" style="margin-top:.5rem">Acceso al Kit de Pausa, eventos, blog y podcast. Suscríbete para desbloquear la Biblioteca Mami completa.</p>`;
      document.getElementById('btn-upgrade').style.display = 'block';
    }
  }

  MM.api('/api/auth-me').then(async res => {
    const data = await res.json();
    if (data.created_at) {
      document.getElementById('f-since').textContent =
        new Date(data.created_at).toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });
    }
    if (data.plan) {
      user = { ...user, plan: data.plan };
      MM.setUser(user);
    }
    renderPlan(data.plan || 'free');
  }).catch(() => renderPlan(user.plan || 'free'));

  async function startCheckout() {
    const btn = document.getElementById('btn-upgrade');
    btn.textContent = 'Redirigiendo…';
    btn.disabled = true;
    try {
      const res  = await MM.api('/api/stripe-checkout', { method: 'POST' });
      const data = await res.json();
      if (data.url) { window.location.href = data.url; return; }
      alert(data.error || 'No se pudo conectar con el sistema de pago.');
    } catch { alert('Error. Inténtalo de nuevo.'); }
    btn.textContent = 'Suscribirme →';
    btn.disabled = false;
  }

  document.getElementById('pwd-form').addEventListener('submit', async e => {
    e.preventDefault();
    const np  = document.getElementById('newpwd').value;
    const cp  = document.getElementById('confirmpwd').value;
    const msg = document.getElementById('pwd-msg');
    const btn = document.getElementById('pwd-btn');
    msg.hidden = true;
    if (np.length < 8) { msg.className='msg error'; msg.textContent='Mínimo 8 caracteres.'; msg.hidden=false; return; }
    if (np !== cp)     { msg.className='msg error'; msg.textContent='Las contraseñas no coinciden.'; msg.hidden=false; return; }
    btn.disabled = true; btn.textContent = 'Guardando…';
    try {
      const res  = await MM.api('/api/auth-change-password', { method:'POST', body: JSON.stringify({ password: np }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Error');
      msg.className='msg success'; msg.textContent='Contraseña actualizada correctamente.'; msg.hidden=false;
      document.getElementById('pwd-form').reset();
    } catch (err) {
      msg.className='msg error'; msg.textContent=err.message; msg.hidden=false;
    } finally {
      btn.disabled=false; btn.textContent='Guardar nueva contraseña';
    }
  });
</script>
<script>(function(){var b=document.getElementById('nav-hamburger'),l=document.querySelector('.nav-links');if(b&&l){b.addEventListener('click',function(e){e.stopPropagation();l.classList.toggle('open')});document.addEventListener('click',function(){l.classList.remove('open')})}})();</script>
</body>
</html>
