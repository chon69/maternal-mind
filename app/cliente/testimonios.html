<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonios · Maternal Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--turq:#7DCFCA;--turq-dark:#5BBFB9;--turq-deep:#4AADA7;--turq-light:#C8EDEB;--turq-vlight:#EEF9F8;--gold:#F2C14E;--gold-dark:#B8820A;--gold-light:#FEF7E0;--ink:#3A3A3A;--ink-soft:#5E5E5E;--cream:#FDFAF5}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
  nav{background:#fff;border-bottom:1px solid rgba(125,207,202,.18);padding:.9rem 5vw;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
  .nav-logo{display:flex;align-items:center;gap:.5rem;text-decoration:none}
  .logo-text{font-size:.95rem;color:var(--turq-dark)}.logo-text span{color:var(--gold);font-weight:500}
  .nav-links{display:flex;align-items:center;gap:1.5rem}
  .nav-links a{font-size:.85rem;color:var(--ink-soft);text-decoration:none;transition:color .2s}
  .nav-links a:hover,.nav-links a.active{color:var(--turq-dark)}
  .nav-user{display:flex;align-items:center;gap:.75rem}
  .nav-greeting{font-size:.82rem;color:var(--ink-soft)}
  .btn-logout{font-size:.8rem;color:var(--turq-deep);background:none;border:1px solid var(--turq-light);border-radius:20px;padding:.35rem .85rem;cursor:pointer;transition:background .2s}
  .btn-logout:hover{background:var(--turq-vlight)}
  .hero-banner{background:linear-gradient(135deg,var(--turq-vlight),var(--gold-light));padding:3rem 5vw;border-bottom:1px solid rgba(125,207,202,.15)}
  .hero-inner{max-width:720px;margin:0 auto}
  .hero-banner h1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,3vw,2.5rem);font-weight:300;font-style:italic;margin-bottom:.75rem}
  .hero-quote{font-family:'Cormorant Garamond',serif;font-size:clamp(1.1rem,2vw,1.35rem);font-style:italic;color:var(--turq-deep);line-height:1.5;max-width:600px}
  .content{max-width:720px;margin:0 auto;padding:2.5rem 5vw}
  .feed{display:flex;flex-direction:column;gap:1.25rem}
  .tst-card{background:#fff;border:1px solid rgba(125,207,202,.18);border-radius:16px;padding:1.6rem 1.75rem;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.03)}
  .tst-card.destacado{border-color:var(--gold);background:linear-gradient(180deg,#fff,var(--gold-light))}
  .tst-quote-mark{font-family:'Cormorant Garamond',serif;font-size:3rem;line-height:1;color:var(--turq-light);position:absolute;top:.75rem;left:1rem}
  .tst-text{font-size:1rem;line-height:1.75;color:var(--ink);white-space:pre-wrap;word-break:break-word;position:relative;padding-left:1.5rem}
  .tst-foot{display:flex;align-items:center;gap:.7rem;margin-top:1.25rem;padding-left:1.5rem}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--turq);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:500;flex-shrink:0}
  .tst-name{font-size:.9rem;font-weight:500;color:var(--ink)}
  .tst-ctx{font-size:.78rem;color:var(--ink-soft);margin-top:.1rem}
  .star-tag{display:inline-block;font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dark);background:#fff;border:1px solid var(--gold);padding:.15rem .5rem;border-radius:50px;margin-left:auto}
  .loading{text-align:center;padding:3rem;color:var(--ink-soft)}.spinner{width:32px;height:32px;border:2.5px solid var(--turq-light);border-top-color:var(--turq);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .75rem}@keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:3rem;color:var(--ink-soft);font-size:.92rem;line-height:1.6}
  .nav-hamburger{display:none;background:none;border:none;cursor:pointer;padding:.4rem;flex-direction:column;justify-content:center;gap:5px}
  .nav-hamburger span{display:block;width:22px;height:2px;background:var(--turq-dark);border-radius:2px}
  @media(max-width:600px){
    .nav-hamburger{display:flex}
    .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;border-bottom:1px solid rgba(125,207,202,.18);box-shadow:0 8px 20px rgba(0,0,0,.06);padding:.5rem 5vw .75rem;gap:0;z-index:49}
    .nav-links.open{display:flex}
    .nav-links a{padding:.65rem 0;border-bottom:1px solid rgba(125,207,202,.07);font-size:.9rem}
    .nav-links a:last-child{border-bottom:none}
    .nav-greeting{display:none}
  }
</style>
</head>
<body>
<nav>
  <a href="/app/cliente/" class="nav-logo">
    <svg width="28" height="16" viewBox="0 0 52 28" fill="none"><ellipse cx="17" cy="14" rx="13" ry="13" stroke="#7DCFCA" stroke-width="3" fill="none"/><ellipse cx="35" cy="14" rx="13" ry="13" stroke="#F2C14E" stroke-width="3" fill="none"/></svg>
    <div class="logo-text">maternal <span>mind</span></div>
  </a>
  <div class="nav-links">
    <a href="/app/cliente/">Inicio</a>
    <a href="/app/cliente/biblioteca.html" style="color:#B8820A;font-weight:500">✨ Biblioteca</a>
    <a href="/app/cliente/eventos.html">Eventos</a>
    <a href="/app/cliente/blog.html">Blog</a>
    <a href="/app/cliente/podcast.html">Podcast</a>
    <a href="/app/cliente/comunidad.html">Comunidad</a>
    <a href="/app/cliente/testimonios.html" class="active">Testimonios</a>
    <a href="/app/cliente/mensajes.html">Mensajes</a>
    <a href="/app/cliente/perfil.html">Mi perfil</a>
  </div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menú"><span></span><span></span><span></span></button>
  <div class="nav-user">
    <span class="nav-greeting" id="greeting"></span>
    <button class="btn-logout" onclick="MM.logout()">Cerrar sesión</button>
  </div>
</nav>

<div class="hero-banner">
  <div class="hero-inner">
    <h1>Testimonios</h1>
    <p class="hero-quote">"Hay cosas de ti que solo se revelan cuando te ves reflejada en otras mujeres que están en el mismo umbral."</p>
  </div>
</div>

<div class="content">
  <div id="feed"><div class="loading"><div class="spinner"></div>Cargando…</div></div>
</div>

<script src="/app/js/auth.js"></script>
<script>
  const user = MM.requireAuth('client');
  if (user) document.getElementById('greeting').textContent = user.nombre.split(' ')[0];

  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function avatarColor(name){
    const colors=['#7DCFCA','#F2C14E','#A78BFA','#6EE7B7','#FCA5A5','#93C5FD'];
    let h=0; for(const c of (name||'M')) h=(h*31+c.charCodeAt(0))%colors.length;
    return colors[Math.abs(h)];
  }
  function render(list){
    const feed=document.getElementById('feed');
    if(!list.length){feed.innerHTML='<div class="empty">Pronto compartiremos aquí las historias de otras madres. 🌿</div>';return;}
    feed.innerHTML=`<div class="feed">${list.map(t=>`
      <div class="tst-card${t.destacado?' destacado':''}">
        <div class="tst-quote-mark">“</div>
        <div class="tst-text">${esc(t.testimonio)}</div>
        <div class="tst-foot">
          <div class="avatar" style="background:${avatarColor(t.nombre)}">${esc((t.nombre||'M').charAt(0).toUpperCase())}</div>
          <div>
            <div class="tst-name">${esc(t.nombre)}</div>
            ${t.contexto?`<div class="tst-ctx">${esc(t.contexto)}</div>`:''}
          </div>
          ${t.destacado?'<span class="star-tag">★ Destacado</span>':''}
        </div>
      </div>`).join('')}</div>`;
  }
  async function load(){
    try{
      const res=await fetch('/api/client-testimonios');
      render(await res.json());
    }catch{
      document.getElementById('feed').innerHTML='<div class="empty">No se pudieron cargar los testimonios. Intenta recargar.</div>';
    }
  }
  load();
</script>
<script>(function(){var b=document.getElementById('nav-hamburger'),l=document.querySelector('.nav-links');if(b&&l){b.addEventListener('click',function(e){e.stopPropagation();l.classList.toggle('open')});document.addEventListener('click',function(){l.classList.remove('open')})}})();</script>
</body>
</html>
