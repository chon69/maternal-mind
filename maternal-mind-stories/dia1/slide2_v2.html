<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Día 1 · Slide 2 · v2</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    background: #FDFAF5;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Glow dorado sutil — fondo crema */
  .bg-glow {
    position: absolute;
    width: 800px; height: 800px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(242,193,78,0.07) 0%, transparent 70%);
    bottom: -150px; left: -150px;
    pointer-events: none;
  }

  /* ── CABECERA ── */
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 176px;
    background: rgba(255,255,255,0.97);
    border-bottom: 2px solid rgba(125,207,202,0.22);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 72px;
    z-index: 20;
  }
  .logo { display: flex; align-items: center; gap: 20px; }
  .logo-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 42px;
    color: #4AADA7;
    letter-spacing: 0.01em;
  }
  .logo-text span { color: #F2C14E; font-weight: 500; }
  .handle {
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 400;
    color: #8A8A8A;
  }

  /* ── BLOQUE TURQUESA RECORTADO ── */
  .turq-block {
    position: absolute;
    top: 220px;
    left: 64px; right: 64px;
    background: #EEF9F8;
    border-radius: 40px;
    padding: 72px 72px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .label {
    font-family: 'DM Sans', sans-serif;
    font-size: 36px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #4AADA7;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 64px;
  }
  .label::before, .label::after {
    content: '';
    display: block;
    width: 56px; height: 1.5px;
    background: #C8EDEB;
  }

  .quote {
    font-family: 'Cormorant Garamond', serif;
    font-size: 116px;
    font-weight: 300;
    font-style: italic;
    color: #3A3A3A;
    line-height: 1.1;
    text-align: center;
  }
  .quote em {
    color: #4AADA7;
    font-style: italic;
  }

  /* ── CTA — fuera del bloque, sobre fondo crema ── */
  .cta-area {
    position: absolute;
    bottom: 340px;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .leaf { font-size: 56px; line-height: 1; margin-bottom: 8px; }

  .cta-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 44px;
    font-weight: 600;
    color: #4AADA7;
    letter-spacing: 0.02em;
  }

  .cta-url {
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 300;
    color: #8A8A8A;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- CABECERA -->
  <div class="header">
    <div class="logo">
      <svg width="100" height="56" viewBox="0 0 52 28" fill="none">
        <ellipse cx="17" cy="14" rx="13" ry="13" stroke="#7DCFCA" stroke-width="3" fill="none"/>
        <ellipse cx="35" cy="14" rx="13" ry="13" stroke="#F2C14E" stroke-width="3" fill="none"/>
      </svg>
      <div class="logo-text">maternal <span>mind</span></div>
    </div>
    <div class="handle">@maternalmind</div>
  </div>

  <!-- BLOQUE TURQUESA con la cita -->
  <div class="turq-block">
    <div class="label">Kit de Pausa</div>
    <div class="quote">
      "Para la madre<br>que necesita<br>volver<br><em>a sí misma."</em>
    </div>
  </div>

  <!-- CTA fuera del bloque -->
  <div class="cta-area">
    <div class="leaf">🌿</div>
    <div class="cta-text">Empieza gratis →</div>
    <div class="cta-url">maternalmind.es</div>
  </div>

</body>
</html>
