<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Día 1 · Slide 1 · v3</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    background: #FDFAF5;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* ── CABECERA ── */
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 176px;
    background: rgba(255,255,255,0.97);
    border-bottom: 2px solid rgba(125,207,202,0.22);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 72px;
    z-index: 20;
  }
  .logo { display: flex; align-items: center; gap: 20px; }
  .logo-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 42px;
    color: #4AADA7;
    letter-spacing: 0.01em;
  }
  .logo-text span { color: #F2C14E; font-weight: 500; }
  .handle {
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 400;
    color: #8A8A8A;
    letter-spacing: 0.02em;
  }

  /* ── GLOW fondo ── */
  .bg-glow {
    position: absolute;
    width: 960px; height: 960px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(125,207,202,0.13) 0%, transparent 68%);
    top: -80px; right: -280px;
    pointer-events: none;
  }

  /* ── ZONA CREMA — titular centrado ── */
  .main {
    position: absolute;
    top: 176px; left: 0; right: 0;
    bottom: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 72px;
    text-align: center;
  }

  /* Badge sin fecha */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: #EEF9F8;
    color: #4AADA7;
    border: 1.5px solid rgba(74,173,167,0.28);
    font-family: 'DM Sans', sans-serif;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 14px 40px;
    border-radius: 50px;
    margin-bottom: 64px;
  }

  /* Headline CENTRADO — el scroll-stop */
  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 196px;
    font-weight: 300;
    font-style: italic;
    color: #3A3A3A;
    line-height: 0.92;
    text-align: center;
    margin-bottom: 52px;
    letter-spacing: -0.01em;
  }

  .leaf {
    font-size: 68px;
    line-height: 1;
  }

  /* ── BLOQUE TURQUESA ── */
  .color-block {
    position: absolute;
    bottom: 200px; left: 60px; right: 60px;
    height: 480px;
    background: linear-gradient(155deg, #5BBFB9 0%, #4AADA7 50%, #3D9B96 100%);
    border-radius: 52px;
    padding: 48px 80px 52px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Nombre producto — PROTAGONISTA en el bloque */
  .product-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 64px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #FFFFFF;
    margin-bottom: 28px;
  }

  /* Línea separadora sutil */
  .block-divider {
    width: 64px;
    height: 2px;
    background: rgba(255,255,255,0.35);
    border-radius: 2px;
    margin-bottom: 36px;
  }

  /* Descripción — una vez, clara */
  .product-desc {
    font-family: 'Cormorant Garamond', serif;
    font-size: 72px;
    font-weight: 300;
    font-style: italic;
    color: rgba(255,255,255,0.95);
    line-height: 1.15;
    margin-bottom: 64px;
  }

  /* CTA — "Gratuito" aparece aquí y solo aquí */
  .cta {
    display: inline-block;
    font-family: 'DM Sans', sans-serif;
    font-size: 44px;
    font-weight: 600;
    color: #FFFFFF;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- CABECERA -->
  <div class="header">
    <div class="logo">
      <svg width="100" height="56" viewBox="0 0 52 28" fill="none">
        <ellipse cx="17" cy="14" rx="13" ry="13" stroke="#7DCFCA" stroke-width="3" fill="none"/>
        <ellipse cx="35" cy="14" rx="13" ry="13" stroke="#F2C14E" stroke-width="3" fill="none"/>
      </svg>
      <div class="logo-text">maternal <span>mind</span></div>
    </div>
    <div class="handle">@maternalmind.es</div>
  </div>

  <!-- ZONA CREMA — centrado -->
  <div class="main">
    <div class="badge">✦ &nbsp;Regalo de bienvenida</div>
    <div class="headline">Ya<br>está<br>aquí.</div>
    <div class="leaf">🌿</div>
  </div>

  <!-- BLOQUE TURQUESA — sin CTA -->
  <div class="color-block">
    <div class="product-name">Kit de Pausa</div>
    <div class="block-divider"></div>
    <div class="product-desc">"5 prácticas para madres que necesitan volver a sí mismas."</div>
  </div>

  <!-- CTA fuera del bloque, en la zona crema -->
  <div style="position:absolute;bottom:100px;left:0;right:0;text-align:center;">
    <div style="font-family:'DM Sans',sans-serif;font-size:44px;font-weight:600;color:#4AADA7;letter-spacing:0.02em;">Empieza aquí</div>
  </div>

</body>
</html>
