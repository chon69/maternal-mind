<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rebrand Slide 2</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; overflow:hidden; position:relative; font-family:'DM Sans',sans-serif; background:#FDFAF5; }
.bg-turq { position:absolute; width:900px; height:900px; border-radius:50%; background:radial-gradient(circle,rgba(125,207,202,0.12) 0%,transparent 70%); top:-200px; right:-250px; pointer-events:none; }
.bg-gold { position:absolute; width:700px; height:700px; border-radius:50%; background:radial-gradient(circle,rgba(242,193,78,0.08) 0%,transparent 70%); bottom:-200px; left:-150px; pointer-events:none; }
.header { position:absolute; top:0; left:0; right:0; height:176px; background:rgba(255,255,255,0.97); border-bottom:2px solid rgba(125,207,202,0.22); display:flex; align-items:center; justify-content:space-between; padding:0 72px; z-index:20; }
.logo-text { font-family:'DM Sans',sans-serif; font-size:42px; color:#4AADA7; letter-spacing:0.01em; }
.logo-text span { color:#F2C14E; font-weight:500; }
.handle { font-family:'DM Sans',sans-serif; font-size:28px; font-weight:400; color:#8A8A8A; }
.divider { width:120px; height:3px; background:linear-gradient(90deg,#4AADA7,#7DCFCA,#C8EDEB); border-radius:2px; }
.label { font-family:'DM Sans',sans-serif; font-size:22px; font-weight:500; letter-spacing:0.2em; text-transform:uppercase; color:#4AADA7; display:flex; align-items:center; justify-content:center; gap:20px; }
.label::before,.label::after { content:''; display:block; width:48px; height:1px; background:#C8EDEB; }
.url { position:absolute; bottom:80px; left:50%; transform:translateX(-50%); font-family:'DM Sans',sans-serif; font-size:28px; font-weight:300; color:#8A8A8A; letter-spacing:0.04em; white-space:nowrap; }
</style>
</head>
<body>

<div class="bg-turq"></div>
<div class="bg-gold"></div>

<div class="header">
  <div style="display:flex;align-items:center;gap:20px;">
    <svg width="100" height="56" viewBox="0 0 52 28" fill="none">
      <ellipse cx="17" cy="14" rx="13" ry="13" stroke="#7DCFCA" stroke-width="3" fill="none"/>
      <ellipse cx="35" cy="14" rx="13" ry="13" stroke="#F2C14E" stroke-width="3" fill="none"/>
    </svg>
    <div class="logo-text">maternal <span>mind</span></div>
  </div>
  <div class="handle">@maternalmind.es</div>
</div>

<div style="position:absolute;top:176px;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 80px 160px;gap:64px;text-align:center;">

  <div class="label">Ahora somos</div>

  <!-- Logo Maternal Mind -->
  <img src="file:///Users/ascensionjorquera/Downloads/image_transparent.png"
       style="width:560px;height:auto;">

  <div class="divider"></div>

  <!-- Texto explicativo -->
  <div style="display:flex;flex-direction:column;gap:32px;">
    <div style="font-family:'Cormorant Garamond',serif;font-size:60px;font-weight:300;font-style:italic;color:#3A3A3A;line-height:1.35;">
      "Un mejor acompañamiento<br>consciente de la maternidad<br>basado en mindfulness."
    </div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;font-style:italic;color:#4AADA7;line-height:1.35;">
      Mismo cariño. Nueva identidad.<br>Os espero aquí.
    </div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;font-style:italic;color:#4AADA7;">— Chon</div>
  </div>

</div>

<div class="url">maternalmind.es</div>
</body>
</html>
