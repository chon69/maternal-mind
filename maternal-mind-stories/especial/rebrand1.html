<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rebrand Slide 1</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; overflow:hidden; position:relative; font-family:'DM Sans',sans-serif; background:#FDFAF5; }
.bg-lavanda { position:absolute; width:1000px; height:1000px; border-radius:50%; background:radial-gradient(circle,rgba(180,160,200,0.12) 0%,transparent 70%); top:-200px; left:-200px; pointer-events:none; }
.bg-glow { position:absolute; width:800px; height:800px; border-radius:50%; background:radial-gradient(circle,rgba(125,207,202,0.08) 0%,transparent 70%); bottom:-200px; right:-200px; pointer-events:none; }
.header { position:absolute; top:0; left:0; right:0; height:176px; background:rgba(255,255,255,0.97); border-bottom:2px solid rgba(125,207,202,0.22); display:flex; align-items:center; justify-content:space-between; padding:0 72px; z-index:20; }
.logo { display:flex; align-items:center; gap:20px; }
.logo-text { font-family:'DM Sans',sans-serif; font-size:42px; color:#4AADA7; letter-spacing:0.01em; }
.logo-text span { color:#F2C14E; font-weight:500; }
.handle { font-family:'DM Sans',sans-serif; font-size:28px; font-weight:400; color:#8A8A8A; }
.label { font-family:'DM Sans',sans-serif; font-size:22px; font-weight:500; letter-spacing:0.2em; text-transform:uppercase; color:#4AADA7; display:flex; align-items:center; justify-content:center; gap:20px; }
.label::before,.label::after { content:''; display:block; width:48px; height:1px; background:#C8EDEB; }
.url { position:absolute; bottom:80px; left:50%; transform:translateX(-50%); font-family:'DM Sans',sans-serif; font-size:28px; font-weight:300; color:#8A8A8A; letter-spacing:0.04em; white-space:nowrap; }
</style>
</head>
<body>

<div class="bg-lavanda"></div>
<div class="bg-glow"></div>

<div class="header">
  <div class="logo">
    <svg width="100" height="56" viewBox="0 0 52 28" fill="none">
      <ellipse cx="17" cy="14" rx="13" ry="13" stroke="#7DCFCA" stroke-width="3" fill="none"/>
      <ellipse cx="35" cy="14" rx="13" ry="13" stroke="#F2C14E" stroke-width="3" fill="none"/>
    </svg>
    <div class="logo-text">maternal <span>mind</span></div>
  </div>
  <div class="handle">@maternalmind.es</div>
</div>

<div style="position:absolute;top:176px;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 80px 280px;gap:56px;text-align:center;">

  <!-- Título destacado -->
  <div style="font-family:'DM Sans',sans-serif;font-size:44px;font-weight:600;color:#4AADA7;letter-spacing:0.08em;text-transform:uppercase;text-align:center;margin-bottom:32px;">Un mensaje importante</div>

  <!-- Logo antiguo — recortado al área del sello -->
  <div style="width:380px;height:380px;border-radius:50%;overflow:hidden;box-shadow:0 12px 56px rgba(150,120,180,0.25);flex-shrink:0;">
    <img src="file:///Users/ascensionjorquera/Downloads/logo_ser_mama_rosa.png"
         style="width:100%;height:auto;object-fit:cover;object-position:top;">
  </div>

  <!-- Texto -->
  <div style="display:flex;flex-direction:column;gap:28px;">
    <div style="font-family:'Cormorant Garamond',serif;font-size:60px;font-weight:300;font-style:italic;color:#5E5E5E;line-height:1.2;">
      "Ser Mamá Círculo Maternal<br>se transforma en…"
    </div>
  </div>

  <!-- Swipe hint -->
  <div style="display:flex;align-items:center;gap:16px;">
    <div style="font-family:'DM Sans',sans-serif;font-size:28px;font-weight:500;color:#4AADA7;letter-spacing:0.14em;text-transform:uppercase;">Desliza</div>
    <div style="color:#4AADA7;font-size:40px;line-height:1;">→</div>
  </div>

</div>

<div class="url">maternalmind.es</div>
</body>
</html>
