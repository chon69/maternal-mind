<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Foto Perfil — Maternal Mind</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  position: relative;
  background: #FDFAF5;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bg-glow {
  position: absolute;
  width: 900px; height: 900px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(125,207,202,0.18) 0%, transparent 65%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.center {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 56px;
}
.logo-text {
  font-family: 'DM Sans', sans-serif;
  font-size: 96px;
  color: #4AADA7;
  letter-spacing: 0.01em;
  line-height: 1;
}
.logo-text span {
  color: #F2C14E;
  font-weight: 500;
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="center">
  <svg width="420" height="236" viewBox="0 0 52 28" fill="none">
    <ellipse cx="17" cy="14" rx="13" ry="13" stroke="#7DCFCA" stroke-width="2.2" fill="none"/>
    <ellipse cx="35" cy="14" rx="13" ry="13" stroke="#F2C14E" stroke-width="2.2" fill="none"/>
  </svg>
  <div class="logo-text">maternal <span>mind</span></div>
</div>

</body>
</html>
