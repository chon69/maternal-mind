<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Post · ¿Quién cuida a la madre?</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#d0d0d0; display:flex; align-items:center; justify-content:center; min-height:100vh; }

.canvas {
  width:1080px; height:1080px;
  background:#FDFAF5;
  position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}

/* Mancha de color — esquina superior derecha */
.wash {
  position:absolute;
  top:-120px; right:-120px;
  width:580px; height:580px;
  border-radius:50%;
  background:radial-gradient(circle at center, #C8EDEB 0%, #EEF9F8 40%, transparent 72%);
}

/* Mancha dorada — esquina inferior izquierda */
.wash-gold {
  position:absolute;
  bottom:-100px; left:-80px;
  width:420px; height:420px;
  border-radius:50%;
  background:radial-gradient(circle at center, rgba(245,223,160,0.45) 0%, transparent 70%);
}

/* Línea de acento superior */
.accent {
  position:absolute; top:0; left:0; right:0; height:5px;
  background:linear-gradient(90deg, #4AADA7 0%, #7DCFCA 55%, #F2C14E 100%);
}

/* Contenido centrado */
.body {
  position:relative; z-index:2;
  text-align:center;
  padding:80px 120px;
}

/* Indicador superior */
.sup {
  font-family:'DM Sans',sans-serif;
  font-size:15px; font-weight:500;
  letter-spacing:0.22em; text-transform:uppercase;
  color:#7DCFCA; margin-bottom:64px;
}

/* Pregunta principal */
.q {
  font-family:'Cormorant Garamond',serif;
  font-weight:300; line-height:1.08;
  color:#3A3A3A; letter-spacing:-0.015em;
}

.q-line1 { font-size:92px; display:block; }
.q-line2 { font-size:92px; display:block; }
.q-line3 {
  font-size:96px; font-style:italic;
  color:#4AADA7; display:block;
  margin-top:12px;
}
.q-line4 { font-size:96px; font-style:italic; color:#4AADA7; display:block; }

/* Separador */
.sep {
  width:48px; height:2px; margin:60px auto 0;
  background:linear-gradient(90deg,#7DCFCA,#F2C14E);
  border-radius:2px;
}

/* Logo pie — el único */
.logo {
  position:absolute; bottom:52px; left:0; right:0;
  display:flex; align-items:center; justify-content:center; gap:10px;
  z-index:2;
}
.logo-dot { width:5px; height:5px; border-radius:50%; background:#C8EDEB; }
.logo-text {
  font-family:'DM Sans',sans-serif;
  font-size:17px; font-weight:500;
  letter-spacing:0.16em; text-transform:uppercase;
}
.logo-text .m { color:#4AADA7; }
.logo-text .n { color:#F2C14E; }
</style>
</head>
<body>
<div class="canvas">
  <div class="accent"></div>
  <div class="wash"></div>
  <div class="wash-gold"></div>

  <div class="body">
    <div class="sup">Maternal Mind</div>
    <div class="q">
      <span class="q-line1">Mientras cuidas</span>
      <span class="q-line2">a tu bebé,</span>
      <span class="q-line3">¿quién cuida</span>
      <span class="q-line4">a la madre?</span>
    </div>
    <div class="sep"></div>
  </div>

  <div class="logo">
    <div class="logo-dot"></div>
    <div class="logo-text"><span class="m">maternal </span><span class="n">mind</span></div>
    <div class="logo-dot"></div>
  </div>
</div>
</body>
</html>
